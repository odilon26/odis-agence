function budgetNotice(){
  if(budgetNow()>0) return '';
  return isPatron()
    ? `<div class="notice"><span>Définissez le budget voté pour calculer les écarts.</span><button class="btn" data-view="reglages">Définir le budget</button></div>`
    : `<div class="notice"><span>Le budget voté n'est pas encore défini. Demandez à votre patron(ne) de le saisir dans Réglages.</span></div>`;
}

/* ═════════ Installation sur l'écran d'accueil ═════════ */
let INSTALL_EVT = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); INSTALL_EVT = e; scheduleRender(); });
window.addEventListener('appinstalled', ()=>{ INSTALL_EVT = null; lsSet('odis_installed', true); scheduleRender(); });
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function installCard(force){
  if(isStandalone()) return force ? `<section class="panel" style="margin-bottom:20px"><h2>Application installée</h2><p class="card-text">Odi's Agence est déjà installée sur cet appareil.</p></section>` : '';
  const hidUntil = Number(lsGet('odis_install_hidden_until', 0)) || 0;
  if(!force && Date.now() < hidUntil) return '';
  const ua = navigator.userAgent || '';
  const ios = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  const inApp = /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|; wv\)|\bwv\b|GSA\//i.test(ua);
  const iosOther = ios && /CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
  const desk = !ios && !/android|mobile/i.test(ua);
  let txt, btn = '';
  if(inApp) txt = `Ce lien est ouvert dans WhatsApp ou une autre app, qui ne permet pas l'installation. Touchez le menu <b>⋮</b> en haut à droite puis <b>« Ouvrir dans Chrome »</b>${ios ? ' (ou Safari sur iPhone)' : ''}, ou copiez l'adresse dans Chrome.`;
  else if(iosOther) txt = `Sur iPhone, l'installation se fait depuis <b>Safari</b> : ouvrez l'adresse dans Safari, touchez <b>Partager</b> puis <b>« Sur l'écran d'accueil »</b>.`;
  else if(ios) txt = `Touchez le bouton <b>Partager</b> de Safari (carré avec une flèche), puis <b>« Sur l'écran d'accueil »</b> et <b>Ajouter</b>.`;
  else if(INSTALL_EVT){ txt = `Une icône Odi's Agence apparaîtra sur l'écran d'accueil, comme une vraie app.`; btn = '<button class="btn primary" data-action="install">Installer</button>'; }
  else if(desk) txt = `Dans Chrome ou Edge, cliquez sur l'icône d'installation à droite de la barre d'adresse, ou sur le menu <b>⋮</b> puis <b>« Installer Odi's Agence »</b>.`;
  else txt = `Dans Chrome, touchez le menu <b>⋮</b> en haut à droite, puis <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b>. Si l'option n'apparaît pas, rechargez la page une fois.`;
  if(inApp) btn = '<button class="btn primary" data-action="copy-url">Copier l\'adresse</button>';
  return `<section class="panel install-card" style="margin-bottom:20px"><h2>Installer l'app sur ${desk ? 'cet ordinateur' : 'ce téléphone'}</h2><p class="card-text">${txt}</p>
    <div class="card-act">${btn}${force ? '' : '<button class="btn" data-action="install-hide">Plus tard</button>'}</div></section>`;
}

/* ═════════ Tableau de bord ═════════ */
function renderBord(m){
  const today = localDate();
  const o = getPoint(today,'ouverture'), f = getPoint(today,'fermeture');
  const lp = f || o || lastPoint();
  let h = `<header class="view-head"><h1>Tableau de bord</h1><p>L'écart compare, à chaque point, tout l'argent de l'agence (opérateurs, espèce et crédits) au budget voté.</p></header>`;
  h += subNotice() + budgetNotice() + teamNotice() + missedNotice() + pendingNotice() + installCard();
  if(!lp){
    h += `<section class="panel empty"><h2>Aucun point enregistré</h2><p>Faites l'ouverture du jour pour voir l'écart avec le budget voté.</p><button class="btn primary" data-view="ouverture">Faire l'ouverture</button></section>`;
  } else {
    h += heroHTML(lp, o, f, today);
    h += `<div class="row2">${dayCardHTML(o, f)}${repartitionHTML(lp)}</div>`;
  }
  h += monthHTML();
  m.innerHTML = h; animateRulers(m);
}
function heroHTML(lp, o, f, today){
  const c = calc(lp), kind = lp.type==='ouverture' ? 'Ouverture' : 'Fermeture';

function dayCardHTML(o, f){

      <div class="trio"><div><small>Ouverture</small><b class="${tone(co.ecart)}">${fmtS(co.ecart)}</b></div><div><small>Fermeture</small><b class="${tone(cf.ecart)}">${fmtS(cf.ecart)}</b></div><div><small>Journée</small><b class="${tone(d)}">${fmtS(d)}</b></div></div>`;
  } else if(o){
    const co = calc(o);
    body = `<p class="card-text">Ouverture faite. Faites la fermeture ce soir pour voir l'évolution de la journée.</p>
      <div class="trio"><div><small>Ouverture</small><b class="${tone(co.ecart)}">${fmtS(co.ecart)}</b></div><div><small>Fermeture</small><b class="muted">—</b></div><div><small>Journée</small><b class="muted">—</b></div></div>

function monthHTML(){
  const pts = POINTS.filter(p=>p.date.startsWith(MONTH_B)), ferms = pts.filter(p=>p.type==='fermeture');
  const days = new Set(pts.map(p=>p.date)).size, manq = ferms.filter(p=>calc(p).ecart<0).length;
  let worst = null; pts.forEach(p=>{ const e = calc(p).ecart; if(e<0 && (!worst || e<worst.e)) worst = { p, e }; });
  const avg = ferms.length ? ferms.reduce((s,p)=>s+calc(p).ecart,0)/ferms.length : null;
  return `<div class="month-head"><h2>Suivi du mois</h2>${monthNavHTML('bord', MONTH_B)}</div>
    <div class="stats">
      <div><small>Jours suivis</small><b>${days}</b><em>${pts.length} point${pts.length>1?'s':''} enregistré${pts.length>1?'s':''}</em></div>
      <div><small>Fermetures avec manquant</small><b class="${manq?'neg':''}">${manq}</b><em>sur ${ferms.length} fermeture${ferms.length>1?'s':''}</em></div>
      <div><small>Plus gros manquant</small><b class="${worst?'neg':''}">${worst?fmtS(worst.e):'Aucun'}</b><em>${worst?(worst.p.type==='ouverture'?'Ouverture':'Fermeture')+' du '+fmtDateShort(worst.p.date):'sur ce mois'}</em></div>
      <div><small>Écart moyen à la fermeture</small><b class="${avg===null?'':tone(Math.round(avg))}">${avg===null?'—':fmtS(avg)}</b><em>chaque jour compté séparément</em></div>
    </div>
    <section class="panel chart-panel"><h2>Écart par jour</h2>${chartHTML(MONTH_B, pts)}</section>`;

function chartHTML(mk, pts){
  const [y,mo] = mk.split('-').map(Number), nd = new Date(y, mo, 0).getDate(), byDay = {};
  pts.forEach(p=>{ (byDay[p.date] = byDay[p.date] || {})[p.type] = calc(p).ecart; });
  const vals = []; Object.values(byDay).forEach(d=>{ if(d.ouverture!==undefined) vals.push(d.ouverture); if(d.fermeture!==undefined) vals.push(d.fermeture); });
  if(!vals.length) return `<p class="card-text">Aucun point enregistré sur ce mois.</p>`;
  const max = Math.max(...vals.map(v=>Math.abs(v)), 1000);
  const W = (window.innerWidth >= 900 ? 1120 : 760), H = 230, pl = 6, pr = 6, top = 14, bot = 30, half = (H-top-bot)/2, mid = top+half, bw = (W-pl-pr)/nd;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Écarts par jour, ${monthLabel(mk)}"><line class="c-zero" x1="${pl}" x2="${W-pr}" y1="${mid}" y2="${mid}"></line>`;
  for(let d=1; d<=nd; d++){
    const ds = `${mk}-${String(d).padStart(2,'0')}`, x = pl+(d-1)*bw, v = byDay[ds];
    if(v && v.fermeture!==undefined){ const e = v.fermeture, hh = Math.max(2, Math.abs(e)/max*half), yy = e<0 ? mid : mid-hh;
      s += `<rect x="${(x+bw*0.18).toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" class="${e<0?'c-neg':(e>0?'c-pos':'c-eq')}"><title>${fmtDateShort(ds)}, fermeture : ${fmtS(e)}</title></rect>`; }
    if(v && v.ouverture!==undefined){ const cy = mid - (v.ouverture/max)*half;
      s += `<circle cx="${(x+bw/2).toFixed(1)}" cy="${cy.toFixed(1)}" r="3.4" class="c-ouv"><title>${fmtDateShort(ds)}, ouverture : ${fmtS(v.ouverture)}</title></circle>`; }
    if(d===1 || d%5===0) s += `<text class="c-lbl" x="${(x+bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle">${d}</text>`;
  }
  s += `</svg>`;
  return `<div class="chart-scroll">${s}</div><div class="c-legend"><span><i style="background:var(--green)"></i>Surplus à la fermeture</span><span><i style="background:var(--red)"></i>Manquant à la fermeture</span><span><i style="background:var(--surface);border:2px solid var(--sky);border-radius:50%"></i>Écart à l'ouverture</span><span>Ligne pointillée : budget voté</span></div>`;
}

function renderForm(m){
  const type = FORM.type, date = FORM.date, rec = getPoint(date, type);
  if(rec && FORM.editing && !canEdit(rec)) FORM.editing = false;
  const isToday = date===localDate();
  let h = `<header class="view-head"><h1>${type==='ouverture'?'Ouverture':'Fermeture'}</h1><p>${type==='ouverture'
      ? "Faites le point au démarrage : le solde de chaque opérateur, l'espèce en caisse et le total des crédits en cours."
      : "Faites le point à la fermeture avec les mêmes éléments qu'à l'ouverture. Sans manquant, l'écart reste au même niveau."}</p></header>`;
  const maxDate = localDate(), minDate = isPatron() ? '' : yesterday();
  h += `<div class="datebar"><label for="f-date">Date du point</label><input type="date" id="f-date" value="${date}" max="${maxDate}"${minDate?` min="${minDate}"`:''}>${isToday?`<span class="chip">Aujourd'hui</span>`:`<button class="link" data-action="today">Revenir à aujourd'hui</button>`}</div>`;
  h += subNotice() + budgetNotice();
  if(rec && !FORM.editing){ m.innerHTML = h + recordedHTML(rec); animateRulers(m); return; }
  if(!canWrite()){
    m.innerHTML = h + `<section class="panel empty"><h2>Saisie suspendue</h2><p>L'abonnement de l'agence n'est plus actif. Vos données sont conservées : renouvelez l'abonnement pour reprendre les points.</p><button class="btn primary" data-view="abonnement">Renouveler l'abonnement</button></section>`;
    return;
  }
  m.innerHTML = h + formHTML(type, date, rec);

}
function formHTML(type, date, rec){
  const key = type+'|'+date, src = (DRAFT[key] && (!rec || (DRAFT[key]._t||0) > ptTime(rec).getTime())) ? DRAFT[key] : (rec ? pointVals(rec) : null), prev = prevPoint(date, type);
  const val0 = k => (src && src[k]!=='' && src[k]!==undefined && src[k]!==null) ? nfs(src[k]) : '';
  CUR_ESP = (src && src._esp) ? { ...src._esp } : null;
  CUR_CRED = (src && Array.isArray(src._cred)) ? src._cred.map(c=>({ ...c })) : null;
  let credCarried = false;
  if(!src && prev && Array.isArray(prev.credList) && prev.credList.length){ CUR_CRED = prev.credList.map(c=>({ ...c })); credCarried = true; }
  const val = k => (k==='credits' && CUR_CRED && CUR_CRED.length) ? nfs(credSum()) : val0(k);
  let notice = '';
  if(type==='fermeture' && !getPoint(date,'ouverture')) notice += `<div class="notice info"><span>Aucune ouverture enregistrée pour cette date : la variation de la journée ne pourra pas être calculée.</span></div>`;
  if(rec && FORM.editing) notice += `<div class="notice info"><span>Vous modifiez ${type==='ouverture'?"l'ouverture":'la fermeture'} déjà enregistrée.</span><button class="btn" data-action="cancel-edit">Annuler la modification</button></div>`;
  const row = (id, badge, label, hint) => `<div class="op-row">${badge}<div class="op-name"><label for="in-${id}">${label}</label>${hint||''}</div><div class="money"><input id="in-${id}" class="amount" inputmode="numeric" autocomplete="off" placeholder="0" value="${val(id)}"><span>F</span></div></div>`;
  const ops = OPS.map(o=>row(o.k, opBadge(o), o.n, prev?`<small>Dernier point : ${fmt(prev.soldes[o.k])}</small>`:'')).join('');
  const esp = row('espece', `<span class="op-badge" style="--c:${ESP_COLOR};--fg:#fff" aria-hidden="true">Cash</span>`, 'Espèce en caisse', `<small>${prev?'Dernier point : '+fmt(prev.espece)+'. ':''}Billets et pièces comptés.</small>`)
    + `<div class="esp-tools"><button class="btn sm" data-action="esp-count">Compter billets et pièces</button><span class="muted small">ou tapez un calcul : 5x100000+25000</span><span id="esp-detail" class="esp-detail small">${espDetailText(CUR_ESP)}</span></div>`;
  const cred = row('credits', `<span class="op-badge" style="--c:${CRED_COLOR};--fg:#0B3B3C" aria-hidden="true">Créd</span>`, 'Crédits en cours', (prev && !(prev.credList && prev.credList.length))?`<small>Dernier point : ${fmt(prev.credits)}. <button class="link" data-action="reuse-credits" data-v="${Number(prev.credits)||0}">Reprendre ce montant</button></small>`:`<small>Total des dépôts faits à crédit et non encore remboursés.</small>`)
    + `<div id="cred-box" class="cred-box">${credListHTML(credCarried)}</div>`;
  return `${notice}<div class="form-grid" id="point-form">
    <div>
      <section class="block"><h2>Soldes des opérateurs</h2><p class="muted small">Le solde affiché sur chaque application au moment du point.</p>${ops}</section>
      <section class="block"><h2>Caisse et crédits</h2>${esp}${cred}</section>
      <section class="block"><h2>Note</h2><textarea id="in-note" class="txt" rows="2" placeholder="Facultatif">${esc(src&&src.note||'')}</textarea></section>
    </div>
    <aside class="live">
      <h2>Résultat du point</h2>
      <div class="lrow"><span>Opérateurs</span><b id="l-flt">0 F</b></div>
      <div class="lrow"><span>Espèce en caisse</span><b id="l-esp">0 F</b></div>
      <div class="lrow"><span>Crédits en cours</span><b id="l-cr">0 F</b></div>
      <div class="lrow tot"><span>Total constaté</span><b id="l-tot">0 F</b></div>
      <div class="lrow"><span>Budget voté</span><b>${budgetNow()?fmt(budgetNow()):'Non défini'}</b></div>
      <div class="live-ecart" id="l-box" aria-live="polite"><div class="lbl" id="l-lbl">Écart</div><div class="val" id="l-val">—</div>${rulerHTML(0, budgetNow(), true, 'l-ruler')}</div>
      <p class="live-var" id="l-var"></p><p class="live-miss" id="l-miss"></p>
      <button class="btn primary block" data-action="save">Enregistrer ${type==='ouverture'?"l'ouverture":'la fermeture'}</button>
    </aside></div>`;
}
/* ═════════ Compteur d'espèces et liste des crédits ═════════ */
const BILLETS = [10000, 5000, 2000, 1000, 500], PIECES = [500, 250, 200, 100, 50, 25, 10, 5];
function espTotal(e){
  if(!e) return 0; let t = (Number(e.l)||0) * (Number(e.lv)||0) + (Number(e.x)||0);
  BILLETS.forEach(b=>t += (Number(e['b'+b])||0)*b); PIECES.forEach(c=>t += (Number(e['p'+c])||0)*c); return t;
}
function espDetailText(e){
  if(!e) return '';
  const parts = [];
  if(Number(e.l)) parts.push(`${e.l} liasse${e.l>1?'s':''} de ${nfs(e.lv)}`);
  BILLETS.forEach(b=>{ if(Number(e['b'+b])) parts.push(`${e['b'+b]} × ${nfs(b)}`); });
  PIECES.forEach(c=>{ if(Number(e['p'+c])) parts.push(`${e['p'+c]} pièce${e['p'+c]>1?'s':''} de ${c}`); });
  if(Number(e.x)) parts.push(`autre ${nfs(e.x)}`);
  return parts.length ? 'Comptage : ' + parts.join(' · ') : '';
}
function openEspCounter(){

  o.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="cnt-t">
    <div class="modal-top"><h2 id="cnt-t">Compter les espèces</h2><button class="modal-x" data-action="close-modal" aria-label="Fermer">×</button></div>

    <div class="cnt-row"><span>Montant d'une liasse</span><input class="cnt-in" data-k="lv" inputmode="numeric" value="${nfs(Number(e.lv)||100000)}"><b></b></div>

    <h3 class="cnt-h">Autre</h3><div class="cnt-row"><span>Autre montant</span><input class="cnt-in" data-k="x" inputmode="numeric" placeholder="0" value="${Number(e.x)?nfs(e.x):''}"><b></b></div>
    <div class="cnt-foot"><div class="cnt-total"><span>Total des espèces</span><b id="cnt-total">0 F</b></div>

  </div>`;
  updateEspCounter();
}
function readEspCounter(){ const e = {}; document.querySelectorAll('#modal .cnt-in').forEach(i=>{ const n = num(i.value); if(n) e[i.dataset.k] = n; }); if(!e.lv) e.lv = 100000; return e; }
function updateEspCounter(){
  const e = readEspCounter();
  document.querySelectorAll('#modal [data-sub]').forEach(b=>{ const k = b.dataset.sub; const n = Number(e[k])||0;
    b.textContent = fmt(k==='l' ? n*(e.lv||0) : n*Number(k.slice(1))); });
  $('#cnt-total').textContent = fmt(espTotal(e));
}
function applyEspCounter(){
  const e = readEspCounter(), t = espTotal(e);
  const keep = Object.keys(e).filter(k=>k!=='lv' && e[k]).length; CUR_ESP = keep ? e : null; if(CUR_ESP && !CUR_ESP.l) delete CUR_ESP.lv;
  closeModal(); const el = $('#in-espece'); if(el){ el.value = keep ? nfs(t) : el.value; }

function credSum(){ return (CUR_CRED||[]).reduce((a,c)=>a+(Number(c.m)||0), 0); }
function daysSince(d){ if(!d) return 0; const a = parseD(d), b = parseD(localDate()); return Math.max(0, Math.round((b-a)/864e5)); }
function credAge(d){ const n = daysSince(d); return n===0 ? "aujourd'hui" : (n===1 ? 'hier' : `${n} j`); }

  return `<div class="cred-head"><b>Détail des crédits</b><span class="muted small">${L.length ? `${L.length} client${L.length>1?'s':''} · total ${fmt(credSum())}` : 'Facultatif : notez à qui vous avez fait un dépôt à crédit.'}</span></div>

function cleanCred(L){

function credListView(L){
  if(!L || !L.length) return '';
  return `<h3 class="sub">Crédits en cours : ${L.length} client${L.length>1?'s':''}</h3><div class="tbl-wrap"><table class="cmp"><thead><tr><th>Client</th><th>Montant</th><th>Depuis</th></tr></thead><tbody>${L.map(c=>`<tr><td>${esc(c.n||'—')}${c.t?` <span class="muted small">${esc(c.t)}</span>`:''}</td><td>${fmt(c.m)}</td><td class="${daysSince(c.d)>=7?'neg':''}">${credAge(c.d)}</td></tr>`).join('')}<tr class="sum"><td>Total</td><td>${fmt(L.reduce((a,c)=>a+(Number(c.m)||0),0))}</td><td></td></tr></tbody></table></div>`;
}
function readForm(){
  const v = {}, missing = [];
  OPS.forEach(o=>{ const raw = $('#in-'+o.k).value.trim(); v[o.k] = raw==='' ? '' : amountOf(raw); if(raw==='') missing.push(o.n); });
  [['espece','Espèce en caisse'],['credits','Crédits en cours']].forEach(([k,n])=>{ const raw = $('#in-'+k).value.trim(); v[k] = raw==='' ? '' : amountOf(raw); if(raw==='') missing.push(n); });
  v.note = $('#in-note').value;
  v._esp = CUR_ESP; v._cred = CUR_CRED;
  return { v, missing };
}
function formatAmount(el){
  if(hasCalc(el.value) || /[+x×X*\-]\s*$/.test(el.value)) return;   // calcul en cours de saisie : on ne reformate pas
  const fromEnd = el.value.length - (el.selectionStart==null ? el.value.length : el.selectionStart);
  const d = el.value.replace(/[^\d]/g,''); el.value = d ? nfs(parseInt(d,10)) : '';
  const pos = Math.max(0, el.value.length - fromEnd); try{ el.setSelectionRange(pos, pos); }catch(_){}
}
function onFormInput(){ const { v } = readForm(); v._t = Date.now(); DRAFT[FORM.type+'|'+FORM.date] = v; lsSet(draftKey(), DRAFT); updateLive(); }
function updateLive(){
  if(!$('#point-form')) return;
  syncCredTotal();
  const { v, missing } = readForm(), soldes = {}; OPS.forEach(o=>soldes[o.k] = Number(v[o.k])||0);
  const budget = budgetNow(), c = calc({ soldes, espece:v.espece, credits:v.credits, budget });
  $('#l-flt').textContent = fmt(c.flt); $('#l-esp').textContent = fmt(c.esp); $('#l-cr').textContent = fmt(c.cr); $('#l-tot').textContent = fmt(c.total);
  const started = missing.length < OPS.length + 2, show = budget && started, complete = show && missing.length===0;
  $('#l-box').className = 'live-ecart ' + (complete ? tone(c.ecart) : '');
  $('#l-lbl').textContent = !budget ? 'Budget non défini' : (complete ? toneLabel(c.ecart) : (show ? 'Écart provisoire, saisie incomplète' : 'Écart'));
  $('#l-val').textContent = show ? fmtS(c.ecart) : '—';
  setRuler($('#l-ruler'), show ? c.ecart : 0, budget);
  const vr = $('#l-var'); vr.innerHTML = '';
  if(FORM.type==='fermeture' && complete){ const o = getPoint(FORM.date, 'ouverture'); if(o){ const d = c.total - calc(o).total; vr.innerHTML = `Depuis l'ouverture : <strong class="${tone(d)}">${fmtS(d)}</strong>`; } }
  $('#l-miss').textContent = missing.length===0 ? 'Tous les montants sont renseignés.' : (missing.length===1 ? `Reste à renseigner : ${missing[0]}.` : `${missing.length} montants restent à renseigner.`);
  document.querySelectorAll('#point-form .money').forEach(mn=>mn.classList.toggle('filled', mn.querySelector('input').value.trim()!==''));
}
function savePoint(){
  if(!canWrite()){ toast("L'abonnement n'est plus actif : renouvelez-le pour enregistrer.", 'err'); go('abonnement'); return; }
  if(!budgetNow()){ toast(isPatron() ? "Définissez d'abord le budget voté dans Réglages." : "Le budget voté n'est pas défini : prévenez votre patron(ne).", 'err'); return; }
  const { v, missing } = readForm();
  if(missing.length){
    toast('Renseignez : ' + missing.join(', ') + '.', 'err');
    const firstId = [...OPS.map(o=>o.k),'espece','credits'].find(k=>$('#in-'+k).value.trim()===''); if(firstId) $('#in-'+firstId).focus();
    return;
  }
  const { type, date } = FORM, existing = getPoint(date, type);
  { const pv = prevPoint(date, type);
    if(pv){
      const odd = [];
      [...OPS.map(o=>[o.k,o.n,Number((pv.soldes||{})[o.k])||0]), ['espece','Espèce en caisse',Number(pv.espece)||0], ['credits','Crédits en cours',Number(pv.credits)||0]].forEach(([k,n,a])=>{
        const b = Number(v[k])||0;
        if(Math.abs(b-a) >= 50000 && ((a>0 && b>0 && (b/a>=5 || a/b>=5)) || (a===0 && b>=500000) || (b===0 && a>=500000))) odd.push(`• ${n} : ${fmt(a)} → ${fmt(b)}`);
      });
      if(odd.length && !confirm(`Vérifiez ces montants, ils sont très différents du point précédent :\n\n${odd.join('\n')}\n\nUn zéro de trop ou de moins ? Touchez Annuler pour corriger, ou OK s'ils sont justes.`)) return;
    } }
  const p = { date, type, soldes:{}, espece:v.espece, credits:v.credits, note:(v.note||'').trim().slice(0,500),
    budget: existing ? Number(existing.budget)||budgetNow() : budgetNow(),
    at:new Date().toISOString(), by:USER.uid, role:PROFILE.role, byNom:PROFILE.nom||'', srvAt:FV.serverTimestamp(), created: existing ? (existing.created || existing.at) : new Date().toISOString() };
  if(existing && existing.soldes) Object.keys(existing.soldes).forEach(k=>{ if(!OPS.some(o=>o.k===k)) p.soldes[k] = Number(existing.soldes[k])||0; });   // opérateur retiré depuis : on garde son solde
  OPS.forEach(o=>p.soldes[o.k] = v[o.k]);
  if(CUR_ESP && espTotal(CUR_ESP)===Number(v.espece)) p.espDetail = { ...CUR_ESP };
  const cl = cleanCred(CUR_CRED); if(cl.length){ p.credList = cl; p.credits = cl.reduce((a,c)=>a+c.m, 0); }
  const pid = `${date}_${type}`, dkey = type+'|'+date;
  const done = ()=>{ delete DRAFT[dkey]; lsSet(draftKey(), DRAFT); };
  writePoint(p, existing, pid).then(done).catch(e=>{
    if(String((e && e.code)||'').includes('permission-denied')) return pointDenied(p, pid, done);
    writeErr(e, existing ? 'La modification' : 'Le point'); scheduleRender();
  });
  db.doc('agences/'+AID).update({ lastAt:FV.serverTimestamp() }).catch(()=>{});
  FORM.editing = false;
  const e = calc(p).ecart;
  toast(`${type==='ouverture'?'Ouverture':'Fermeture'} enregistrée. ${toneLabel(e)} : ${fmtS(e)}.`);
  setTimeout(()=>{ render(); window.scrollTo({ top:0 }); }, 60);
}
// Écriture d'un point : création simple, ou modification avec archivage de l'ancienne version.
function writePoint(p, existing, pid){
  if(!existing) return db.doc(`agences/${AID}/points/${pid}`).set(p);
  const oldRev = Number(existing.rev)||0; p.rev = oldRev + 1;
  if(existing.soldes) Object.keys(existing.soldes).forEach(k=>{ if(p.soldes[k]===undefined) p.soldes[k] = Number(existing.soldes[k])||0; });
  const b = db.batch();
  b.set(db.doc(`agences/${AID}/revisions/${pid}_r${oldRev}`), { pid, rev:oldRev, old:existing, by:USER.uid, byNom:PROFILE.nom||'', at:FV.serverTimestamp() });
  b.set(db.doc(`agences/${AID}/points/${pid}`), p);
  return b.commit();
}
// Point refusé : 1) le point existe peut-être déjà sur le serveur (saisi ailleurs) → on propose de le remplacer proprement ;
// 2) sinon, on demande au serveur quelle condition bloque et on l'affiche clairement.
async function pointDenied(p, pid, done){
  let srv = null;
  try{ const snap = await db.doc(`agences/${AID}/points/${pid}`).get({ source:'server' }); if(snap.exists) srv = snap.data(); }catch(_){}
  if(srv){
    const who = srv.byNom || (srv.role==='patron' ? 'le patron / la patronne' : 'un autre compte');
    const lab = p.type==='ouverture' ? "L'ouverture" : 'La fermeture';
    if(confirm(`${lab} de ce jour a déjà été enregistrée par ${who} (${ptWhen(srv)}).\n\nRemplacer par votre saisie ? L'ancienne version reste gardée dans l'historique.`)){
      const q = { ...p, soldes:{ ...p.soldes }, budget: Number(srv.budget)||p.budget, created: srv.created || srv.at || p.created };
      delete q.rev;
      try{ await writePoint(q, srv, pid); done(); toast(`${lab} mise à jour. L'ancienne version est gardée.`); scheduleRender(); return; }
      catch(e2){ /* on passe au diagnostic */ }
    } else { scheduleRender(); return; }
  }
  toast('Le serveur a refusé le point. Recherche de la cause…', 'err');
  const fails = await diagnosePoint(p);
  showDenied(fails, p);
  scheduleRender();
}
const DIAG_TESTS = [
  ['membre', "Votre compte n'est pas (ou plus) accepté dans cette agence. Le patron doit vous accepter dans Réglages, Équipe."],
  ['abonnement', "L'abonnement de l'agence n'est pas actif côté serveur. Le patron doit payer ou attendre la validation."],

  ['heure-serveur', "Version de l'app trop ancienne. Fermez complètement l'app et rouvrez-la."],
  ['auteur-id', "Problème de compte : déconnectez-vous puis reconnectez-vous."],
  ['auteur-nom', "Votre nom a changé : déconnectez-vous puis reconnectez-vous."],
  ['auteur-role', "Problème de compte : déconnectez-vous puis reconnectez-vous."],
  ['budget', "Le budget voté a changé : rechargez l'app avant de saisir."],
  ['operateurs', "La liste des opérateurs a changé : rechargez l'app avant de saisir."],

  ['date-recente', "La date du point n'est ni aujourd'hui ni hier pour le serveur. Vérifiez la DATE et l'HEURE du téléphone (Paramètres, Date et heure automatiques)."],
  ['point-complet', ''],
  ['creation', "La règle du serveur refuse le point. Publiez les règles Firebase version 6 (ou plus récente)."],
  ['point-existe', "Ce point existe déjà sur le serveur (saisi sur un autre téléphone). Rechargez l'app."]
];
async function diagnosePoint(p){
  const fails = [];
  for(const [t, msg] of DIAG_TESTS){
    try{ await db.collection('diag').add({ t, d:p, aid:AID }); if(t==='point-existe') fails.push([t, msg]); }
    catch(e){ if(t!=='point-existe' && t!=='point-complet') fails.push([t, msg]); }
  }
  // « creation » n'est utile que si toutes les autres conditions passent (règle trop lourde ou anciennes règles publiées).
  return fails.length > 1 ? fails.filter(([t])=>t!=='creation') : fails;
}

  o.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="den-t">

    <p class="small muted" style="margin-top:12px">Date et heure de ce téléphone : <b>${esc(now.toLocaleString('fr-FR'))}</b></p>
    <div class="actions" style="margin-top:14px">${wa?`<a class="btn wa" href="https://wa.me/${wa}?text=${encodeURIComponent(report)}" target="_blank" rel="noopener">Envoyer le diagnostic</a>`:''}<button class="btn" data-action="close-modal">Fermer</button></div>
  </div>`;
  try{ console.warn(report); }catch(_){}
}

function compareTable(o, f){
  const co = calc(o), cf = calc(f), rows = opsOf(o,f).map(op=>[op.n, Number(o.soldes[op.k])||0, Number(f.soldes[op.k])||0]);
  rows.push(['Espèce en caisse', co.esp, cf.esp], ['Crédits en cours', co.cr, cf.cr]);
  return `<div class="tbl-wrap"><table class="cmp"><thead><tr><th>Élément</th><th>Ouverture</th><th>Fermeture</th><th>Variation</th></tr></thead><tbody>${rows.map(([n,a,b])=>`<tr><td>${n}</td><td>${fmt(a)}</td><td>${fmt(b)}</td><td class="muted">${b-a===0?'—':fmtS(b-a)}</td></tr>`).join('')}
    <tr class="sum"><td>Total constaté</td><td>${fmt(co.total)}</td><td>${fmt(cf.total)}</td><td class="${tone(cf.total-co.total)}">${fmtS(cf.total-co.total)}</td></tr>
    <tr class="sum"><td>Écart avec le budget</td><td class="${tone(co.ecart)}">${fmtS(co.ecart)}</td><td class="${tone(cf.ecart)}">${fmtS(cf.ecart)}</td><td></td></tr></tbody></table></div>`;
}
function singleTable(p){

}

function renderHist(m){
  const pts = POINTS.filter(p=>p.date.startsWith(MONTH_H)), dates = [...new Set(pts.map(p=>p.date))].sort().reverse();
  let h = `<header class="view-head"><h1>Historique</h1><p>Chaque jour est évalué séparément : les écarts ne s'additionnent pas d'un jour à l'autre.</p></header>`;

  h += `<div class="days">` + dates.map(d=>{

    const who = [o,f].filter(Boolean).map(p=>`<p class="small muted" style="margin-top:6px"><strong>${p.type==='ouverture'?'Ouverture':'Fermeture'}</strong> faite ${ptWhen(p)} par ${esc(p.byNom || (p.role==='patron'?'le patron / la patronne':'le gérant / la gérante'))}${lateTag(p)}</p>`).join('');
    const notes = [o,f].filter(p=>p && p.note).map(p=>`<p class="note"><strong>${p.type==='ouverture'?'Ouverture':'Fermeture'} :</strong> ${esc(p.note)}</p>`).join('');
    return `<details class="day" data-date="${d}"${HIST_OPEN.has(d)?' open':''}><summary><span class="d-date">${fmtDateLong(d)}</span>${cell('Ouverture', eo, eo===null?'':tone(eo))}${cell('Fermeture', ef, ef===null?'':tone(ef))}${cell('Journée', vr, vr===null?'':tone(vr))}<span class="chev" aria-hidden="true"></span></summary>

  }).join('') + `</div>`;
  m.innerHTML = h;
}

function exportData(){
  const data = { app:"Odi's Agence", agence:AGENCE.nom, exporte_le:new Date().toISOString(), budget:{ montant:budgetNow() }, points:POINTS };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `odis-agence-${localDate()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);

}
function importData(input){
  const file = input.files && input.files[0]; if(!file) return;
  if(!canWrite()){ toast("L'abonnement n'est plus actif : import impossible.", 'err'); input.value = ''; return; }
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.points)){ toast("Fichier non reconnu : il ne contient pas de points d'ouverture ou de fermeture.", 'err'); return; }
      const all = d.points.filter(p=>p && /^\d{4}-\d{2}-\d{2}$/.test(p.date) && (p.type==='ouverture'||p.type==='fermeture') && p.soldes);
      const pts = all.filter(p=>!getPoint(p.date, p.type)), skipped = all.length - pts.length;
      let okN = 0, koN = 0;
      for(let i=0; i<pts.length; i+=400){
        const b = db.batch(), chunk = pts.slice(i, i+400);
        chunk.forEach(p=>{
          const pos = x => { const n = Number(x); return Number.isFinite(n) ? Math.min(99999999999, Math.max(0, n)) : 0; };
          const soldes = {}; Object.keys(p.soldes||{}).filter(k=>OP_CATALOG.some(o=>o.k===k)||CUSTOM_KEYS.includes(k)).forEach(k=>soldes[k] = pos(p.soldes[k]));
          if(!Object.keys(soldes).length) DEFAULT_OPS.forEach(k=>soldes[k]=0);
          b.set(db.doc(`agences/${AID}/points/${p.date}_${p.type}`), { date:p.date, type:p.type, soldes, espece:pos(p.espece), credits:pos(p.credits),
            note:String(p.note||'').slice(0,500), budget:pos(p.budget)||budgetNow(), at:String(p.at||new Date().toISOString()), by:USER.uid, role:'patron', byNom:String(p.byNom||'').slice(0,60), srvAt:FV.serverTimestamp(), created:String(p.created||p.at||new Date().toISOString()) });
        });
        try{ await b.commit(); okN += chunk.length; }catch(e){ koN += chunk.length; }
      }
      toast(`${okN} point${okN>1?'s':''} importé${okN>1?'s':''}${skipped ? `, ${skipped} déjà présent${skipped>1?'s':''} (non remplacé${skipped>1?'s':''})` : ''}${koN ? `, ${koN} refusé${koN>1?'s':''} par le serveur` : ''}.`, koN?'err':'');
    }catch(e){ toast("Lecture impossible : le fichier est abîmé ou ce n'est pas une sauvegarde de l'application.", 'err'); }
    input.value = '';
  };
  r.readAsText(file);
}

function lastSeen(a){

  return `<div class="subl" style="${d>=3?'color:var(--red);font-weight:700':''}">Dernière saisie : ${d<=0?'aujourd\'hui':(d===1?'hier':'il y a '+d+' j')}</div>`;
}
function remindAgency(id){
  const a = ALL_AG.find(x=>x.id===id); if(!a) return;
  let num = waDigits(a.waPatron || a.telephone || ''); if(num.length===10) num = '225' + num;
  const s = subStatus(a), amount = priceOf(a);

}

function loadPayCounts(){ ALL_AG.filter(a=>a.tarifDemande && PAY_COUNT[a.tarifDemande]===undefined).forEach(a=>{ PAY_COUNT[a.tarifDemande] = 0;

function parrainOf(a){ return a && a.parrainCode ? (ALL_AG.find(x=>x.id!==a.id && agCode(x.id)===a.parrainCode) || null) : null; }
async function validateAgency(id){
  const a = ALL_AG.find(x=>x.id===id); if(!a) return;
  const now = new Date(), exp = tsDate(a.exp) || now, base = exp > now ? exp : now, nexp = new Date(base.getTime() + periode()*DAY);
  if(!confirm(`Valider le paiement de ${a.nom} ? L'abonnement ira jusqu'au ${fmtDay(nexp)}.`)) return;
  try{
    const b = db.batch();
    b.update(db.doc('agences/'+id), { exp:TS.fromDate(nexp), declared:null, blockDeclare:false });
    b.set(db.collection('agences/'+id+'/paiements').doc(), { montant:priceOf(a), periode:periode(), validatedAt:FV.serverTimestamp(), newExp:TS.fromDate(nexp), declaredAt:a.declared||null });
    const pr = a.parrainCode && !a.parrainPaid ? parrainOf(a) : null;
    let bonus = '';
    if(pr && confirm(`${a.nom} a été parrainée par ${pr.nom}. Offrir 1 mois gratuit (${periode()} jours) à ${pr.nom} ?`)){
      const pe = tsDate(pr.exp) || now, pb = pe > now ? pe : now, pn = new Date(pb.getTime() + periode()*DAY);
      b.update(db.doc('agences/'+pr.id), { exp:TS.fromDate(pn), bonusMois:(Number(pr.bonusMois)||0)+1 });
      b.update(db.doc('agences/'+id), { parrainPaid:true });
      bonus = ` ${pr.nom} reçoit 1 mois offert (jusqu'au ${fmtDay(pn)}).`;
    }
    await b.commit(); toast(`${a.nom} : abonnement prolongé jusqu'au ${fmtDay(nexp)}.${bonus}`);
    if(pr && bonus && pr.waPatron){ const msg = `Bonjour ${pr.ownerNom||''}, ici Odi's Agence. Merci d'avoir recommandé l'application à ${a.nom} ! Comme promis, votre abonnement de ${pr.nom} est prolongé d'1 mois offert.`; if(confirm('Prévenir le parrain sur WhatsApp ?')) window.open(`https://wa.me/${waDigits(pr.waPatron).length===10?'225'+waDigits(pr.waPatron):waDigits(pr.waPatron)}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener'); }
  }catch(e){ writeErr(e, 'La validation'); }
}
async function rejectAgency(id){
  const a = ALL_AG.find(x=>x.id===id); if(!a) return;
  if(!confirm(`Rejeter le paiement déclaré par ${a.nom} ? À faire seulement si le paiement est introuvable dans Wave Business.`)) return;
  try{ await db.doc('agences/'+id).update({ declared:null, blockDeclare:true }); toast(`Paiement de ${a.nom} rejeté. L'agence ne pourra pas redéclarer tant que vous ne l'aurez pas débloquée.`); }
  catch(e){ writeErr(e, 'Le rejet'); }
}

async function deleteAgency(id){
  const a = ALL_AG.find(x=>x.id===id); if(!a) return;
  const typed = prompt(`Supprimer définitivement « ${a.nom} » ?\n\nTous ses points, paiements et comptes (patron(ne) et gérant(e)s) seront effacés. Cette action est irréversible.\n\nPour confirmer, tapez SUPPRIMER :`);
  if(typed===null) return;
  if(typed.trim().toUpperCase()!=='SUPPRIMER'){ toast('Suppression annulée : le mot SUPPRIMER n\'a pas été saisi.', 'err'); return; }
  try{
    toast(`Suppression de ${a.nom} en cours…`);
    const refs = [];
    for(const sub of ['points','paiements','revisions']){ const q = await db.collection('agences/'+id+'/'+sub).get(); q.docs.forEach(d=>refs.push(d.ref)); }
    const us = await db.collection('users').where('agenceId','==',id).get(); us.docs.forEach(d=>refs.push(d.ref));
    if(a.invite) refs.push(db.doc('invites/'+a.invite));
    for(let i=0; i<refs.length; i+=400){ const b = db.batch(); refs.slice(i, i+400).forEach(r=>b.delete(r)); await b.commit(); }
    await db.doc('agences/'+id).delete();
    toast(`${a.nom} a été supprimée.`);
  }catch(e){ toast(`La suppression a échoué${e && e.code ? ' (code : '+e.code+')' : ''}. Vérifiez la connexion et que les règles Firestore sont à jour.`, 'err'); }
}

document.addEventListener('click', async e=>{
  if(!e.target.closest('#acct-menu') && !e.target.closest('[data-action=acct-menu]')) closeMenu();
  if(e.target.id==='modal'){ closeModal(); return; }
  const g = e.target.closest('[data-gate]'); if(g){ GATE = g.dataset.gate; renderGate(); return; }
  const v = e.target.closest('[data-view]'); if(v && !v.closest('#gate')){ e.preventDefault(); go(v.dataset.view); return; }
  const a = e.target.closest('[data-action]'); if(!a) return;
  const act = a.dataset.action;
  if(act==='logout') logout();
  else if(act==='acct-menu'){ e.stopPropagation(); toggleMenu(); }
  else if(act==='switch-acct') switchAccount(a.dataset.app);
  else if(act==='add-acct'){ closeMenu(); addAccount(); }
  else if(act==='cancel-add') cancelAdd();
  else if(act==='suggest') openSuggest();
  else if(act==='go-aide'){ closeMenu(); go('aide'); }
  else if(act==='close-modal') closeModal();
  else if(act==='news-ok'){ lsSet('odis_seen_version', APP_VERSION); closeModal(); }
  else if(act==='sug-type'){ SUG_TYPE = a.dataset.t; document.querySelectorAll('[data-action=sug-type]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===SUG_TYPE)); }
  else if(act==='sug-send') sendSuggest();
  else if(act==='today'){ FORM.date = localDate(); FORM.editing = false; render(); }
  else if(act==='save') savePoint();
  else if(act==='edit'){ FORM.editing = true; render(); }
  else if(act==='cancel-edit'){ delete DRAFT[FORM.type+'|'+FORM.date]; lsSet(draftKey(), DRAFT); FORM.editing = false; render(); }

  else if(act==='del'){
    const lab = a.dataset.type==='ouverture' ? "l'ouverture" : 'la fermeture';
    if(!confirm(`Supprimer ${lab} du ${fmtDateShort(a.dataset.date)} ? Cette action est définitive.`)) return;
    db.doc(`agences/${AID}/points/${a.dataset.date}_${a.dataset.type}`).delete().catch(err=>writeErr(err, 'La suppression'));
    FORM.editing = false; toast(`${a.dataset.type==='ouverture'?'Ouverture':'Fermeture'} supprimée.`);
  }
  else if(act==='esp-count') openEspCounter();
  else if(act==='esp-apply') applyEspCounter();
  else if(act==='cred-add'){ CUR_CRED = CUR_CRED || []; CUR_CRED.push({ n:'', m:0, t:'', d:FORM.date }); refreshCred(); const r = document.querySelectorAll('#cred-box .cred-n'); if(r.length) r[r.length-1].focus(); }
  else if(act==='cred-paid'){ const i = Number(a.dataset.i); const c = CUR_CRED && CUR_CRED[i]; if(c && (!c.m || confirm(`${c.n||'Ce client'} a remboursé ${fmt(c.m)} ? Il sera retiré de la liste.`))){ CUR_CRED.splice(i,1); refreshCred(); } }
  else if(act==='reuse-credits'){ const el = $('#in-credits'); el.value = nfs(Number(a.dataset.v)||0); onFormInput(); el.focus(); }
  else if(act==='copy-summary'){ const p = getPoint(a.dataset.date, a.dataset.type); if(p) copyText(summaryText(p)).then(ok=>toast(ok?'Résumé copié.':'Copie impossible : utilisez le bouton WhatsApp.', ok?'':'err')); }
  else if(act==='month'){
    const dir = Number(a.dataset.dir), cur = monthKey(new Date());
    if(a.dataset.scope==='bord'){ const n = shiftMonth(MONTH_B, dir); if(n<=cur) MONTH_B = n; } else { const n = shiftMonth(MONTH_H, dir); if(n<=cur) MONTH_H = n; }
    render();
  }
  else if(act==='declare'){
    if(!confirm('Confirmez-vous avoir payé ' + fmt(myPrix()) + ' par Wave ?')) return;
    a.disabled = true;
    db.doc('agences/'+AID).update({ declared:FV.serverTimestamp() }).then(()=>toast("Paiement déclaré. Envoyez maintenant le message à l'administrateur.")).catch(err=>{ a.disabled = false; writeErr(err, 'La déclaration'); });
  }
  else if(act==='copy-parrain') copyText(parrainMsg()).then(ok=>toast(ok?'Lien de parrainage copié.':'Copie impossible : utilisez le bouton WhatsApp.', ok?'':'err'));
  else if(act==='copy-decl') copyText(declareMsg()).then(ok=>toast(ok?'Message copié.':'Copie impossible : utilisez le bouton WhatsApp.', ok?'':'err'));
  else if(act==='save-ops') saveOps();
  else if(act==='do-missed'){ FORM.date = yesterday(); FORM.editing = false; go('fermeture'); }
  else if(act==='save-budget'){
    const n = num($('#set-budget').value); if(n<=0){ toast('Saisissez un budget supérieur à zéro.', 'err'); return; }
    db.doc('agences/'+AID).update({ budget:n }).then(()=>toast(`Budget enregistré : ${fmt(n)}.`)).catch(err=>writeErr(err, 'Le budget'));
  }
  else if(act==='save-info'){
    const nom = $('#set-nom').value.trim(), w = waDigits($('#set-wa').value);
    if(!nom){ toast("Le nom de l'agence est obligatoire.", 'err'); return; }
    if(w && (w.length<8 || w.length>15)){ toast('Numéro WhatsApp invalide : indicatif compris, entre 8 et 15 chiffres.', 'err'); return; }
    db.doc('agences/'+AID).update({ nom, ville:$('#set-ville').value.trim(), telephone:$('#set-tel').value.trim(), waPatron:w }).then(()=>toast('Informations enregistrées.')).catch(err=>writeErr(err, 'La modification'));
  }
  else if(act==='new-invite') newInvite();
  else if(act==='del-invite') delInvite();
  else if(act==='copy-invite') copyText(AGENCE.invite).then(ok=>toast(ok?'Code copié.':'Copie impossible.', ok?'':'err'));
  else if(act==='approve-member'){
    db.doc('users/'+a.dataset.uid).update({ status:'ok' }).then(()=>toast(`${a.dataset.nom} peut maintenant utiliser l'app.`)).catch(err=>writeErr(err, 'La validation'));
  }
  else if(act==='remove-member'){
    if(!confirm(`Retirer ${a.dataset.nom} de l'agence ? Son compte n'aura plus accès aux points.`)) return;
    db.doc('users/'+a.dataset.uid).delete().then(async ()=>{ if(AGENCE && AGENCE.invite) await newInvite(); toast(`${a.dataset.nom} a été retirée. Le code d'invitation a été changé.`); }).catch(err=>writeErr(err, 'Le retrait'));
  }
  else if(act==='export') exportData();
  else if(act==='install'){ if(INSTALL_EVT){ INSTALL_EVT.prompt(); INSTALL_EVT.userChoice.finally(()=>{ INSTALL_EVT = null; render(); }); } }
  else if(act==='install-hide'){ lsSet('odis_install_hidden_until', Date.now() + 2*DAY); render(); }
  else if(act==='copy-url'){ const ok = await copyText(location.origin + '/'); toast(ok ? 'Adresse copiée. Collez-la dans Chrome.' : location.origin); }
  else if(act==='filter'){ ADMIN_FILTER = a.dataset.f; render(); }
  else if(act==='validate') validateAgency(a.dataset.id);
  else if(act==='reject') rejectAgency(a.dataset.id);
  else if(act==='del-agency') deleteAgency(a.dataset.id);
  else if(act==='remind') remindAgency(a.dataset.id);
  else if(act==='sug-filter'){ SUG_FILTER = a.dataset.f; render(); }
  else if(act==='sug-status') db.doc('suggestions/'+a.dataset.id).update({ status:a.dataset.s }).catch(e=>writeErr(e,'La mise à jour'));
  else if(act==='unblock'){ const ag = ALL_AG.find(x=>x.id===a.dataset.id); if(ag && confirm(`Autoriser ${ag.nom} à déclarer de nouveau un paiement ?`)) db.doc('agences/'+ag.id).update({ blockDeclare:false }).then(()=>toast('Agence débloquée.')).catch(e=>writeErr(e,'Le déblocage')); }
  else if(act==='show-revs') showRevisions(a.dataset.pid);
  else if(act==='tarif-ask') tarifAsk();
  else if(act==='tarif-cancel') db.doc('agences/'+AID).update({ tarifDemande:null }).then(()=>toast('Demande annulée.')).catch(e=>writeErr(e,'L\'annulation'));
  else if(act==='tarif-ok') tarifDecide(a.dataset.id, true);
  else if(act==='tarif-no') tarifDecide(a.dataset.id, false);
  else if(act==='save-settings'){
    const p = num($('#adm-prix').value), per = num($('#adm-per').value), link = $('#adm-link').value.trim(), w = waDigits($('#adm-wa').value);
    if(p<=0 || per<=0){ toast('Le prix et la durée doivent être supérieurs à zéro.', 'err'); return; }
    if(link && !/^https:\/\//.test(link)){ toast('Le lien Wave doit commencer par https://', 'err'); return; }
    const sup = num($('#adm-sup').value) || 2000;
    const tuto = $('#adm-tuto').value.trim(), chan = $('#adm-chan').value.trim();
    if((tuto && !/^https:\/\//.test(tuto)) || (chan && !/^https:\/\//.test(chan))){ toast('Les liens doivent commencer par https://', 'err'); return; }
    db.doc('settings/app').set({ prix:p, prixSup:sup, periode:per, waveLink:link, waAdmin:w, tutoLink:tuto, channelLink:chan }, { merge:true }).then(()=>toast('Paramètres enregistrés.')).catch(err=>writeErr(err, 'Les paramètres'));
  }
  else if(act==='send-verify'){ try{ await USER.sendEmailVerification(); toast('E-mail de confirmation envoyé. Pensez à regarder dans les spams.'); }catch(err){ toast(authMsg(err), 'err'); } }
  else if(act==='check-verify'){
    try{ await USER.reload(); const u = auth.currentUser; await u.getIdToken(true);
      if(u.emailVerified){ ADMIN_READY = true; listenAll(); toast('Adresse confirmée. Console activée.'); render(); }
      else toast("L'adresse n'est pas encore confirmée. Touchez le lien reçu par e-mail.", 'err');
    }catch(err){ toast(authMsg(err), 'err'); }
  }
});
document.addEventListener('input', e=>{
  if(e.target.matches('#modal .cnt-in')){ if(e.target.dataset.k==='lv' || e.target.dataset.k==='x') formatAmount(e.target); updateEspCounter(); return; }
  if(e.target.matches('#cred-box [data-cf]')){
    const r = e.target.closest('[data-ci]'), i = Number(r.dataset.ci), f = e.target.dataset.cf;
    if(f==='m') formatAmount(e.target);
    if(CUR_CRED && CUR_CRED[i]) CUR_CRED[i][f] = f==='m' ? num(e.target.value) : e.target.value;
    syncCredTotal();
  }
  if(e.target.id==='in-espece' && CUR_ESP && amountOf(e.target.value)!==espTotal(CUR_ESP)){ CUR_ESP = null; const d = $('#esp-detail'); if(d) d.textContent = ''; }
  if(e.target.matches('input.amount')) formatAmount(e.target);
  if(e.target.matches('.code-in')) e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(e.target.closest('#point-form')) onFormInput();
});
document.addEventListener('focusout', e=>{
  if(e.target.matches && e.target.matches('input.amount') && hasCalc(e.target.value)){ const r = evalAmount(e.target.value); if(r!=null){ e.target.value = nfs(r); if(e.target.closest('#point-form')) onFormInput(); } }
});
document.addEventListener('change', e=>{
  if(e.target.id==='f-date'){ let v = e.target.value; if(!v) return; if(v > localDate()) v = localDate(); if(!isPatron() && v < yesterday()) v = yesterday(); FORM.date = v; FORM.editing = false; render(); }
  if(e.target.id==='import-file') importData(e.target);
});

if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
