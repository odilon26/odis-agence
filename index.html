<style>
:root{
  /* Palette Odi's Agence V2.5 */
  --dark:#0F172A; --teal:#0D9488; --teal-d:#0F766E; --teal-l:#CCFBF1; --sky-d:#0284C7; --dark2:#1E293B; --orange:#F59E0B;
  --grad:linear-gradient(135deg,#0F766E,#0284C7); --grad-btn:linear-gradient(135deg,#0D9488,#0EA5E9);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04); --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.05);
  --r:12px; --r-sm:8px;
  --deep:#0F766E; --title:#0F172A; --text:#0F172A; --muted:#64748B;
  --bg:#F1F5F9; --surface:#FFFFFF; --surface-2:#FFFFFF; --line:#E2E8F0; --line-2:#F1F5F9; --track:#E2E8F0;
  --lagoon:#0D9488; --lagoon-d:#0F766E; --lagoon-l:#CCFBF1; --sky:#0EA5E9; --sky-l:#E0F2FE; --sky-t:#0C4A6E; --sky-b:#BAE6FD;
  --red:#EF4444; --red-l:#FEE2E2; --red-b:#FECACA; --green:#10B981; --green-l:#D1FAE5;
  --amber-l:#FEF3C7; --amber-t:#92400E; --amber-b:#FDE68A; --filled:#99F6E4; --wave:#1DC8FF; --wave-ink:#04314A;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px}
.neg{color:var(--red)} .pos{color:var(--green)} .zero{color:var(--title)}

/* ── Écrans d'accueil (connexion, inscription, configuration) ── */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--deep)}
.gate-card{width:min(440px,100%);background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.stripe{height:5px;background:linear-gradient(90deg,var(--lagoon),var(--sky))}
.gate-body{padding:28px 26px 26px}
.g-brand{font-size:28px;font-weight:800;letter-spacing:-.025em;color:var(--title);line-height:1.1}
.g-sub{color:var(--muted);margin-top:6px}
.g-title{font-size:19px;font-weight:800;color:var(--title);margin-top:22px}
.g-form{display:grid;gap:12px;margin-top:14px}
.g-links{display:grid;gap:8px;margin-top:18px;justify-items:center;text-align:center}
.g-err{color:var(--red);font-weight:600;font-size:14px;min-height:20px}
.g-ok{color:var(--green);font-weight:600;font-size:14px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:700;font-size:14px;color:var(--title)}
.field small{color:var(--muted);font-size:12.5px}
.txt{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface-2);width:100%;min-width:0}
.txt:focus{outline:none;border-color:var(--lagoon);box-shadow:0 0 0 3px var(--lagoon-l)}
textarea.txt{resize:vertical}
.code-in{text-transform:uppercase;letter-spacing:.25em;font-weight:800;text-align:center;font-size:20px}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── En-tête ── */
.app-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.top{background:var(--deep);color:#fff}
.top-in{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.015em;line-height:1.2;min-width:0}
.brand span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:500;font-size:12.5px;opacity:.65}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#9AB7B3}
.sync.ok i{background:#5FE0A6} .sync.wait i{background:#F2C14E} .sync.off i{background:#FF8B7E}
.role{font-size:13px;font-weight:700;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:999px;white-space:nowrap}
.btn-out{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700}
.btn-out:hover{background:rgba(255,255,255,.08)}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1100px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;padding:14px 13px 11px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--title)}
.tab[aria-current="page"]{color:var(--title);border-bottom-color:var(--lagoon)}
.tdot{width:8px;height:8px;border-radius:50%}
.tdot.ok{background:var(--green)} .tdot.wait{background:#E2A23A} .tdot.bad{background:var(--red)}

main{max-width:1100px;margin:0 auto;padding:28px 20px 96px}
.view-head{margin-bottom:20px}
.view-head h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.025em;color:var(--title);text-wrap:balance}
.view-head p{color:var(--muted);margin-top:6px;max-width:64ch}

/* ── Boutons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--title);text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--lagoon)}
.btn.primary{background:var(--lagoon);border-color:var(--lagoon);color:#fff}
.btn.primary:hover{background:var(--lagoon-d);border-color:var(--lagoon-d)}
.btn.danger{color:var(--red);border-color:var(--red-b)}
.btn.danger:hover{background:var(--red-l)}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.wave{background:var(--wave);border-color:var(--wave);color:var(--wave-ink)}
.btn.block{width:100%;padding:13px 18px;font-size:15px}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--lagoon-d);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0;font-size:inherit}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.panel h2{font-size:17px;font-weight:800;color:var(--title);letter-spacing:-.01em}
.panel > p{color:var(--muted);margin-top:6px;max-width:66ch}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:12px;padding:14px 16px;margin-bottom:18px;font-weight:600;background:var(--amber-l);color:var(--amber-t);border:1px solid var(--amber-b)}
.notice.info{background:var(--sky-l);color:var(--sky-t);border-color:var(--sky-b)}
.notice.bad{background:var(--red-l);color:var(--red);border-color:var(--red-b)}
.notice span{min-width:0;flex:1 1 260px}

/* ── Tableau de bord ── */
.hero{background:var(--deep);color:#fff;border-radius:24px;padding:30px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:34px;margin-bottom:20px}
.hero-k{font-size:15px;font-weight:700;color:rgba(255,255,255,.8)}
.hero-when{font-size:14px;color:rgba(255,255,255,.55)}
.ecart-big{font-size:clamp(42px,7.5vw,74px);font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:16px}
.hero .ecart-big.neg{color:#FF8B7E} .hero .ecart-big.pos{color:#5FE0A6} .hero .ecart-big.zero{color:#fff}
.hero-tone{margin-top:12px;font-weight:600;color:rgba(255,255,255,.85)}
.ruler{margin-top:24px}
.ruler-track{position:relative;height:12px;border-radius:999px;background:rgba(255,255,255,.12)}
.ruler-fill{position:absolute;top:0;bottom:0;left:50%;width:0;border-radius:999px;transition:left .8s cubic-bezier(.2,.8,.2,1),width .8s cubic-bezier(.2,.8,.2,1)}
.ruler-fill.neg{background:#FF8B7E} .ruler-fill.pos{background:#5FE0A6} .ruler-fill.zero{background:#fff}
.ruler-zero{position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:#fff;border-radius:2px}
.ruler-scale{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55);margin-top:8px}
.ruler.light .ruler-track{background:var(--track)}
.ruler.light .ruler-fill.neg{background:var(--red)} .ruler.light .ruler-fill.pos{background:var(--green)} .ruler.light .ruler-fill.zero{background:var(--title)}
.ruler.light .ruler-zero{background:var(--title)} .ruler.light .ruler-scale{color:var(--muted)}
.steps{list-style:none;display:grid;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px}
.steps .mark{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;border:2px solid rgba(255,255,255,.35)}
.steps li.done .mark{background:var(--lagoon);border-color:var(--lagoon)}
.steps .s-t{font-weight:700;display:block}
.steps .s-m{font-size:13px;color:rgba(255,255,255,.6)}
.steps .go{margin-left:auto;background:#fff;color:#0B3B3C;border:0;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.hero-kv{display:grid;gap:8px;margin-top:20px}
.hero-kv div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.hero-kv dt{color:rgba(255,255,255,.65)} .hero-kv dd{font-weight:700}
.hero-kv .tot{border-top:1px solid rgba(255,255,255,.15);padding-top:9px;margin-top:2px}
.hero-kv .tot dt{color:#fff;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.trio div{border-left:3px solid var(--line);padding-left:12px}
.trio small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.trio b{font-size:19px;font-weight:800;display:block;margin-top:2px}
.card-text{color:var(--muted);margin-top:6px}
.card-act{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;margin-top:18px;background:var(--track);gap:2px}
.stack span{height:100%}
.legend{list-style:none;margin-top:14px;display:grid;gap:8px}
.legend li{display:flex;align-items:center;gap:10px;font-size:14px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .v{margin-left:auto;font-weight:700}
.legend .pc{width:46px;text-align:right;color:var(--muted);font-size:13px}
.month-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 14px}
.month-head h2{font-size:21px;font-weight:800;color:var(--title);letter-spacing:-.015em}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:17px;font-weight:800;color:var(--title);line-height:1}
.mnav button:hover{border-color:var(--lagoon)}
.mnav button:disabled{opacity:.35;cursor:not-allowed}
.mnav span{min-width:150px;text-align:center;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:18px}
.stats>div{padding:18px 20px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0}
.stats small{color:var(--muted);font-size:13px;font-weight:600;display:block}
.stats b{display:block;font-size:22px;font-weight:800;margin-top:4px;color:var(--title);letter-spacing:-.01em}
.stats em{font-style:normal;font-size:12.5px;color:var(--muted)}
.chart-panel{margin-top:16px}
.chart-scroll{overflow-x:auto;margin-top:10px}
.chart{width:100%;min-width:560px;height:auto;display:block}
.c-zero{stroke:var(--title);stroke-width:1.5;stroke-dasharray:4 4;opacity:.45}
.c-neg{fill:var(--red)} .c-pos{fill:var(--green)} .c-eq{fill:var(--title)}
.c-ouv{fill:var(--surface);stroke:var(--sky);stroke-width:2.2}
.c-lbl{font-size:11px;fill:var(--muted);font-family:var(--font)}
.c-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.c-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.empty{text-align:center;padding:40px 20px}
.empty h2{font-size:20px;font-weight:800;color:var(--title)}
.empty p{color:var(--muted);margin:6px auto 18px;max-width:46ch}

/* ── Formulaire de point ── */
.datebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.datebar label{font-weight:700;color:var(--title)}
.datebar input{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.chip{font-size:12.5px;font-weight:800;background:var(--lagoon-l);color:var(--lagoon-d);padding:4px 10px;border-radius:999px}
.form-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.block{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px 20px 8px;margin-bottom:16px}
.block h2{font-size:16px;font-weight:800;color:var(--title)}
.block>p{margin:2px 0 6px}
.op-row{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(150px,210px);align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.op-row:last-child{border-bottom:0}
.op-badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--c);color:var(--fg)}
.op-name label{font-weight:700;color:var(--title);display:block}
.op-name small{color:var(--muted);font-size:12.5px}
.money{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0 12px;transition:border-color .15s,box-shadow .15s}
.money:focus-within{border-color:var(--lagoon);box-shadow:0 0 0 3px var(--lagoon-l);background:var(--surface)}
.money.filled{border-color:var(--filled);background:var(--surface)}
.money input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;font-size:17px;font-weight:700;text-align:right;outline:none}
.money span{margin-left:6px;color:var(--muted);font-weight:700}
.block .txt{margin:8px 0 12px}
.live{position:sticky;top:calc(env(safe-area-inset-top,0px) + 128px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.live h2{font-size:16px;font-weight:800;color:var(--title);margin-bottom:10px}
.lrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
.lrow span{color:var(--muted)}
.lrow.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.lrow.tot span{color:var(--title);font-weight:700}
.live-ecart{margin-top:16px;padding:16px;border-radius:14px;background:var(--bg);color:var(--title)}
.live-ecart.neg{background:var(--red-l);color:var(--red)}
.live-ecart.pos{background:var(--green-l);color:var(--green)}
.live-ecart .lbl{font-weight:700;font-size:14px}
.live-ecart .val{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-top:4px}
.live-ecart .ruler{margin-top:16px}
.live-var{font-size:14px;margin-top:12px}
.live-miss{font-size:13px;color:var(--muted);margin:12px 0}

/* ── Point enregistré ── */
.rec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px;background:var(--green-l);color:var(--green)}
.badge.wait{background:var(--amber-l);color:var(--amber-t)}
.badge.info{background:var(--sky-l);color:var(--sky-t)}
.badge.bad{background:var(--red-l);color:var(--red)}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;margin-top:20px}
.rec .ecart-big{margin-top:8px}
.rec-tone{font-weight:700;margin-top:8px}
.rec-var{margin-top:14px;font-size:14px}
.kv{display:grid}
.kv div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv dt{color:var(--muted)} .kv dd{font-weight:700;text-align:right}
.kv .tot{border-bottom:0;border-top:1.5px solid var(--line);margin-top:4px}
.kv .tot dt{color:var(--title);font-weight:700}
.sub{font-size:15px;font-weight:800;color:var(--title);margin-top:26px}
.note{margin-top:16px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.share{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-2)}
.share h3{font-size:15px;font-weight:800;color:var(--title)}
.share p{font-size:13.5px;color:var(--muted);margin-top:2px}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.cmp th{text-align:right;font-size:12.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--line)}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line-2)}
.cmp tr.sum td{font-weight:800;border-top:1.5px solid var(--line);border-bottom:0}

/* ── Historique ── */
.days{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.day{min-width:0}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.day summary{list-style:none;display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr)) 18px;gap:12px;align-items:center;padding:14px 18px;cursor:pointer}
.day summary::-webkit-details-marker{display:none}
.day[open]{border-color:var(--filled)}
.d-date{font-weight:700;color:var(--title)}
.d-cell small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.d-cell b{font-weight:800}
.d-cell em{font-style:normal;color:var(--muted)}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
.day[open] .chev{transform:rotate(225deg);margin-top:4px}
.day-body{padding:0 18px 18px;border-top:1px solid var(--line-2)}

/* ── Abonnement ── */
.sub-card{border-radius:18px;padding:22px;border:1px solid var(--line);background:var(--surface)}
.sub-card.ok{background:var(--green-l);border-color:color-mix(in srgb,var(--green) 25%,transparent)}
.sub-card.warn{background:var(--amber-l);border-color:var(--amber-b)}
.sub-card.info{background:var(--sky-l);border-color:var(--sky-b)}
.sub-card.bad{background:var(--red-l);border-color:var(--red-b)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px;background:var(--surface)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--green)} .pill.warn{color:var(--amber-t)} .pill.info{color:var(--sky-t)} .pill.bad{color:var(--red)}
.sub-days{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.sub-days b{font-size:44px;font-weight:800;line-height:1;color:var(--title)}
.meter{height:8px;border-radius:999px;background:color-mix(in srgb,var(--title) 10%,transparent);overflow:hidden;margin-top:12px}
.meter span{display:block;height:100%;border-radius:999px;background:var(--lagoon)}
.msg{margin-top:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.plist{list-style:none;display:grid;gap:8px;margin-top:12px}
.plist li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;padding:10px 12px;background:var(--bg);border-radius:10px}

/* ── Réglages / Console ── */
.sets{display:grid;gap:16px;max-width:760px}
.inline{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:flex-end}
.inline .money,.inline .field{flex:1;min-width:180px}
.invite{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.invite b{font-size:26px;letter-spacing:.2em;color:var(--title);font-weight:800;background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:8px 16px}
.team{list-style:none;display:grid;gap:8px;margin-top:14px}
.team li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px}
.set.danger{border-color:var(--red-b)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi small{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.kpi b{display:block;font-size:24px;font-weight:800;color:var(--title);margin-top:2px}
table.adm{width:100%;border-collapse:collapse;min-width:720px;font-size:14px}
.adm th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1.5px solid var(--line)}
.adm td{padding:12px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.adm tr.attn td{background:color-mix(in srgb,var(--sky) 9%,transparent)}
.adm .name{font-weight:700;color:var(--title)}
.adm .subl{font-size:12.5px;color:var(--muted)}
.tdact{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--lagoon-l);color:var(--title);border-color:var(--lagoon)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:var(--deep);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(92vw,520px);z-index:100;box-shadow:0 10px 30px rgba(11,59,60,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:860px){
  .hero,.row2,.form-grid,.rec-grid{grid-template-columns:1fr}
  .live{position:static}
  .stats,.kpis{grid-template-columns:1fr 1fr}
  .stats>div:nth-child(3){border-left:0}
  .stats>div:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:560px){
  main{padding:20px 16px 80px}
  .top-in{padding:10px 16px}
  .brand small,.role{display:none}
  .hero{padding:22px;border-radius:20px;gap:24px}
  .view-head h1{font-size:26px}
  .op-row{grid-template-columns:36px minmax(0,1fr)}
  .op-badge{width:36px;height:36px}
  .op-row .money{grid-column:1/-1}
  .day summary{grid-template-columns:repeat(3,minmax(0,1fr)) 18px}
  .d-date{grid-column:1/-1}
  .trio b{font-size:16px}
  .split2{grid-template-columns:1fr}
  .sync span{max-width:110px;overflow:hidden;text-overflow:ellipsis}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ═════════ Habillage V2.5 ═════════ */
body{font-size:14px;line-height:1.45}
.stripe{display:none}
/* Écrans de connexion */
.gate{background:var(--grad)}
.gate-card{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.gate-body{padding:2.5rem 2rem 2rem}
.g-brand{text-align:center;font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.g-brand span{color:var(--teal)}
.g-sub{text-align:center;font-size:13px;margin-top:4px}
.g-title{font-size:15px;margin-top:1.75rem}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.txt{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:#fff;font-size:14px}
.txt:focus{border-color:var(--teal);box-shadow:none}
.code-in{border-width:2px;font-size:1.3rem;letter-spacing:.3em}
/* Boutons */
.btn{border-radius:var(--r-sm);font-size:13px;font-weight:600;padding:9px 16px;border:1.5px solid var(--line)}
.btn.primary{background:var(--grad-btn);border:0;color:#fff;font-weight:700}
.btn.primary:hover{background:var(--grad-btn);opacity:.9}
.btn.block{padding:13px;font-size:15px;font-weight:700}
.btn.danger{background:var(--red-l);color:var(--red);border-color:transparent}
.btn.danger:hover{background:#FECACA}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:6px}
.link{color:var(--teal)}
/* En-tête */
.top{background:var(--grad);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top-in{max-width:680px;padding:0 1rem;height:56px}
.brand{font-size:15px;font-weight:800;letter-spacing:-.3px}
.brand small{font-size:11.5px;font-weight:400;opacity:.7}
.role{font-size:12px;font-weight:600;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px}
.sync{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.15);padding:5px 10px;border-radius:20px}
.btn-out{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:var(--r-sm);padding:6px 12px;font-size:12px;font-weight:600}
.tabs{background:#fff;border-bottom:1px solid var(--line)}
.tabs-in{max-width:680px;padding:0 1rem;gap:0}
.tab{padding:14px 12px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-current="page"]{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
/* Contenu */
main{max-width:680px;padding:1rem 1rem 80px}
.view-head{margin-bottom:1.25rem}
.view-head h1{font-size:1.1rem;font-weight:800;letter-spacing:0}
.view-head p{font-size:12px;margin-top:4px}
.panel,.block,.live,.sub-card,.day,.kpi{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.panel{padding:1.25rem}
.panel h2,.block h2,.live h2{font-size:14px;font-weight:700}
.panel > p,.card-text{font-size:13px}
.notice{border-radius:var(--r-sm);padding:12px 14px;font-size:13px;font-weight:500;margin-bottom:1rem}
/* Grilles en une colonne, comme la V2.5 */
.hero,.row2,.form-grid,.rec-grid{grid-template-columns:1fr}
.row2{gap:1rem}
.live{position:static}
/* Carte principale (écart) */
.hero{background:var(--grad);border-radius:var(--r);padding:1.25rem;gap:1.25rem;margin-bottom:1rem}
.hero-k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.75)}
.hero-when{font-size:12px;color:rgba(255,255,255,.65)}
.ecart-big{font-size:2.2rem;letter-spacing:-.02em;margin-top:10px}
.hero .ecart-big.neg{color:#FECACA} .hero .ecart-big.pos{color:#A7F3D0}
.hero-tone{font-size:13px}
.ruler-fill.neg{background:#FCA5A5} .ruler-fill.pos{background:#6EE7B7}
.steps li{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);border-radius:var(--r-sm);padding:10px 12px}
.steps li.done .mark{background:#fff;border-color:#fff;color:var(--teal-d)}
.steps .go{color:var(--teal-d);border-radius:var(--r-sm)}
/* Cartes statistiques à bordure colorée */
.stats,.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:none;border:0;border-radius:0}
.stats>div,.kpi{background:#fff;border:0!important;border-left:4px solid var(--teal)!important;border-radius:var(--r);box-shadow:var(--shadow);padding:1rem 1.1rem}
.stats>div:nth-child(2),.kpi:nth-child(2){border-left-color:var(--sky)!important}
.stats>div:nth-child(3),.kpi:nth-child(3){border-left-color:var(--orange)!important}
.stats>div:nth-child(4),.kpi:nth-child(4){border-left-color:var(--red)!important}
.stats small,.kpi small,.trio small,.d-cell small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.stats b,.kpi b{font-size:1.25rem;font-weight:800}
.stats em{font-size:11px}
.trio div{border-left:3px solid var(--teal)}
.trio div:nth-child(2){border-left-color:var(--sky)} .trio div:nth-child(3){border-left-color:var(--orange)}
.month-head{margin:1.5rem 0 .75rem}
.month-head h2{font-size:1rem}
.mnav button{border-radius:var(--r-sm)}
/* Saisie */
.datebar input{border-radius:var(--r-sm)}
.op-row{background:var(--bg);border:0;border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px}
.block{padding:1.1rem 1.1rem .6rem}
.op-badge{border-radius:50%}
.money{border-radius:var(--r-sm);background:#fff}
.money:focus-within{box-shadow:none;border-color:var(--teal)}
.money input{font-size:15px}
.live{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff}
.live h2{color:#fff}
.live .lrow span{color:rgba(255,255,255,.65)}
.live .lrow.tot{border-top-color:rgba(255,255,255,.2)} .live .lrow.tot span{color:#fff}
.live-ecart{background:rgba(255,255,255,.08);color:#fff}
.live-ecart.neg{background:rgba(239,68,68,.18);color:#FCA5A5}
.live-ecart.pos{background:rgba(16,185,129,.18);color:#6EE7B7}
.live-ecart .val{font-size:1.6rem}
.live .ruler.light .ruler-track{background:rgba(255,255,255,.15)} .live .ruler.light .ruler-zero{background:#fff} .live .ruler.light .ruler-scale{color:rgba(255,255,255,.55)}
.live-miss,.live-var{color:rgba(255,255,255,.75)}
.live .btn:not(.primary){background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
/* Historique, abonnement, console */
.day summary{padding:12px 14px}
.day{border-left:4px solid var(--teal)}
.badge,.pill{border-radius:20px;font-size:11px;font-weight:700}
.sub-card{padding:1.25rem}
.sub-card.ok{background:#fff;border-left:4px solid var(--green)}
.sub-card.warn{background:#fff;border-left:4px solid var(--orange)}
.sub-card.info{background:#fff;border-left:4px solid var(--sky)}
.sub-card.bad{background:#fff;border-left:4px solid var(--red)}
.pill{background:var(--bg)}
.sub-days b{font-size:2.2rem}
.meter span{background:var(--grad-btn)}
.plist li,.team li{border-radius:var(--r-sm)}
.invite b{border-radius:var(--r-sm)}
.filters button{border-radius:20px;font-size:12px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.adm tr.attn td{background:var(--sky-l)}
.toast{background:var(--dark);border-radius:30px;font-size:13px;font-weight:600;padding:10px 20px}
.toast.err{background:var(--red)}
@media (max-width:560px){ .top-in{padding:0 1rem} main{padding:1rem 1rem 80px} .hero{padding:1.1rem} .view-head h1{font-size:1.1rem} }
@media (max-width:560px){
  .op-row{grid-template-columns:32px minmax(0,1fr) 150px;gap:10px}
  .op-row .money{grid-column:auto}
  .op-badge{width:32px;height:32px;font-size:10px}
  .op-name small{display:none}
  .money input{font-size:14px;padding:9px 0}
  .tbl-wrap:has(table.adm){overflow:visible}
  table.adm{min-width:0}
  .adm thead{display:none}
  .adm,.adm tbody,.adm tr,.adm td{display:block}
  .adm tr{background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px}
  .adm td{border:0;padding:3px 0}
  .adm tr.attn td{background:none} .adm tr.attn{background:var(--sky-l)}
  .adm tr{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
  .adm td:first-child,.adm td:nth-child(4),.adm td:last-child{grid-column:1/-1}
  .adm td:nth-child(2),.adm td:nth-child(3){font-size:13px}
  .adm td:last-child{padding-top:8px}
}
@media (max-width:380px){ .stats,.kpis{grid-template-columns:1fr} }

/* ═════════ Ordinateur (écrans larges) ═════════ */
@media (min-width:900px){
  .top-in,.tabs-in{max-width:1180px;padding-left:24px;padding-right:24px}
  main{max-width:1180px;padding:28px 24px 60px}
  .view-head h1{font-size:1.5rem}
  .view-head p{font-size:13.5px}
  .hero{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;padding:1.75rem}
  .ecart-big{font-size:3.2rem}
  .row2{grid-template-columns:1fr 1fr;gap:1.25rem}
  .stats,.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .form-grid{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:1.5rem}
  .live{position:sticky;top:130px}
  .op-row{grid-template-columns:40px minmax(0,1fr) 220px}
  .rec-grid{grid-template-columns:1fr 1fr;gap:32px}
  .sets{max-width:none;grid-template-columns:1fr 1fr;align-items:start}
  .notice,.install-card{max-width:none}
}

/* ═════════ Comptes, suggestions, mot de passe ═════════ */
.acct-btn{position:relative;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;padding:0}
.acct-btn:hover{background:rgba(255,255,255,.28)}
.acct-btn i{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:#F59E0B;color:#fff;font-style:normal;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #0F766E}
.acct-menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);right:12px;width:min(330px,calc(100vw - 24px));background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(15,23,42,.25),0 0 0 1px rgba(15,23,42,.06);padding:8px;z-index:200;max-height:calc(100vh - 90px);overflow:auto}
.am-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px}
.am-row,.am-act{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;color:var(--title);font-size:14px;font-weight:600}
.am-row:hover,.am-act:hover{background:var(--bg)}
.am-row.cur{background:var(--teal-l)}
.am-t{flex:1;min-width:0}
.am-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-t small{display:block;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-ok{color:var(--teal);font-weight:900}
.av{width:34px;height:34px;flex:none;border-radius:50%;background:var(--grad-btn);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:800}
.av.plus{background:var(--bg);color:var(--teal);font-size:20px;border:1.5px dashed var(--teal)}
.av.ic{background:var(--bg);font-size:15px}
.am-act.out{color:var(--red)}
.am-sep{height:1px;background:var(--line);margin:6px 4px}
.g-accts{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px;justify-items:stretch;text-align:center}
.g-accts>p{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal-top{display:flex;justify-content:space-between;align-items:center}
.modal-top h2{font-size:17px;font-weight:800;color:var(--title)}
.modal-x{width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);font-size:22px;line-height:1;color:var(--muted)}
.sug-types{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sug-types button{flex:1;min-width:90px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;font-weight:700;font-size:13px;color:var(--muted)}
.sug-types button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
.pw-wrap{position:relative;display:block}
.pw-wrap .txt{padding-right:46px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:8px}
.pw-eye:hover{color:var(--teal);background:var(--bg)}

/* Choix des opérateurs */
.ops-g{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.ops-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.op-chk{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--title);background:#fff}
.op-chk:has(input:checked){border-color:var(--teal);background:var(--teal-l)}
.op-chk input{width:18px;height:18px;accent-color:var(--teal);flex:none}
.op-chk .op-badge{width:28px;height:28px;font-size:9px;flex:none}
.ops-custom{display:grid;gap:8px}

.op-badge.logo{background:#fff;padding:0;overflow:hidden;box-shadow:0 0 0 1px rgba(15,23,42,.08)}
.op-badge.logo img{width:100%;height:100%;object-fit:cover;display:block}

.faq details{border-bottom:1px solid var(--line-2);padding:4px 0}
.faq summary{cursor:pointer;font-weight:700;color:var(--title);padding:10px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:'+';color:var(--teal);font-size:20px;line-height:1}

<body>
<noscript><h1>Odi's Agence</h1><p>Application pour les agences mobile money (Orange Money, Wave, MTN, Moov, Djamo, Western Union…) : point d'ouverture et de fermeture en 2 minutes, écart avec le budget voté calculé tout seul, compteur de billets, crédits nommés, résumé WhatsApp au patron, fonctionne sans réseau. 7 jours d'essai gratuit. Née à Aboisso, en Côte d'Ivoire, pensée pour toutes les agences mobile money, partout. Une solution Odi'Service Digital.</p><p>Activez JavaScript pour utiliser l'application.</p></noscript>

<div id="gate" class="gate"><div class="gate-card"><div class="stripe"></div><div class="gate-body" id="gate-body"><div class="spin" style="border-color:var(--line);border-top-color:var(--lagoon)"></div></div></div></div>

<div id="app" class="hidden">
  <div class="app-head">
    <div class="top">
      <div class="top-in">
        <div class="brand"><span id="top-name">Odi's Agence</span><small id="top-date"></small></div>
        <div class="top-right">
          <span class="sync ok" id="sync" role="status"><i aria-hidden="true"></i><span>Synchronisé</span></span>
          <span class="role" id="top-role"></span>
          <button class="acct-btn" data-action="acct-menu" aria-haspopup="true" aria-label="Comptes et options"><span id="acct-btn">?</span><i id="acct-n" class="hidden">1</i></button>
        </div>
      </div>
      <div class="stripe"></div>
    </div>
    <nav class="tabs" aria-label="Navigation"><div class="tabs-in" id="tabs"></div></nav>
  </div>
  <main id="main"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="acct-menu" class="acct-menu hidden" role="menu"></div>
<div id="modal" class="modal hidden"></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
'use strict';

/* ═════════ Configuration ═════════ */
const CFG = window.ODIS_CONFIG || {};
const GRACE_DAYS = 3, REMIND_DAYS = 3;   // doivent correspondre aux règles Firestore
// Catalogue des opérateurs exerçant en Côte d'Ivoire. Chaque point de vente choisit les siens dans Réglages.
const OP_CATALOG = [
  { k:'om',     n:'Orange Money',     a:'OM',   c:'#FF7900', fg:'#FFFFFF', g:'Mobile money' },
  { k:'wave',   n:'Wave',             a:'W',    c:'#1DC8FF', fg:'#04314A', g:'Mobile money' },
  { k:'mtn',    n:'MTN MoMo',         a:'MTN',  c:'#FFCB05', fg:'#3A2E00', g:'Mobile money' },
  { k:'moov',   n:'Moov Money',       a:'Moov', c:'#0A6EBD', fg:'#FFFFFF', g:'Mobile money' },
  { k:'tom',    n:'Transfert Orange', a:'TO',   c:'#B4430E', fg:'#FFFFFF', g:'Mobile money' },
  { k:'peya',   n:'Peya Pay',         a:'PP',   c:'#7C3AED', fg:'#FFFFFF', g:'Mobile money' },
  { k:'tresor', n:'Trésor Money',     a:'TM',   c:'#0F766E', fg:'#FFFFFF', g:'Mobile money' },
  { k:'djamo',  n:'Djamo',            a:'DJ',   c:'#111827', fg:'#FFFFFF', g:'Fintech' },
  { k:'push',   n:'Push',             a:'PU',   c:'#12AD07', fg:'#FFFFFF', g:'Fintech' },
  { k:'julaya', n:'Julaya',           a:'JU',   c:'#2563EB', fg:'#FFFFFF', g:'Fintech' },
  { k:'cinetpay', n:'CinetPay',       a:'CP',   c:'#16A34A', fg:'#FFFFFF', g:'Fintech' },
  { k:'feexpay', n:'FeexPay',         a:'FX',   c:'#EA580C', fg:'#FFFFFF', g:'Fintech' },
  { k:'dunya',  n:'PayDunya',            a:'DU',   c:'#0D9488', fg:'#FFFFFF', g:'Fintech' },
  { k:'paymetrust', n:'Paymetrust',   a:'PT',   c:'#1E3A8A', fg:'#FFFFFF', g:'Fintech' },
  { k:'touchpoint', n:'Touchpoint',   a:'TP',   c:'#DB2777', fg:'#FFFFFF', g:'Fintech' },
  { k:'syca',   n:'SycaPay',             a:'SY',   c:'#4B5563', fg:'#FFFFFF', g:'Fintech' },
  { k:'wu',     n:'Western Union',    a:'WU',   c:'#FFDD00', fg:'#111111', g:'Transfert international' },
  { k:'mg',     n:'MoneyGram',        a:'MG',   c:'#DA291C', fg:'#FFFFFF', g:'Transfert international' },
  { k:'ria',    n:'Ria',              a:'RIA',  c:'#F26522', fg:'#FFFFFF', g:'Transfert international' },
  { k:'nita',   n:'NITA',             a:'NT',   c:'#B45309', fg:'#FFFFFF', g:'Transfert international' }
];
const LOGOS = ['om','wave','mtn','moov','tresor','djamo','push','wu','mg','nita','ria','touchpoint','paymetrust','dunya','feexpay','cinetpay','julaya','peya','syca'];
function opBadge(o, extra){
  return LOGOS.includes(o.k)
    ? `<span class="op-badge logo${extra?' '+extra:''}" aria-hidden="true"><img src="logos/${o.k}.png" alt="" loading="lazy"></span>`
    : `<span class="op-badge${extra?' '+extra:''}" style="--c:${o.c};--fg:${o.fg}" aria-hidden="true">${o.a}</span>`;
}
const CUSTOM_KEYS = ['c1','c2','c3'], CUSTOM_COLORS = ['#475569','#9333EA','#0891B2'];
const DEFAULT_OPS = ['om','wave','mtn','moov','tom'];
function opInfo(k, ag){
  const c = OP_CATALOG.find(o=>o.k===k); if(c) return c;
  const i = CUSTOM_KEYS.indexOf(k), nm = String(((ag||AGENCE||{}).customOps||{})[k] || ('Autre ' + (i+1))).replace(/[<>"&'`]/g, '').slice(0,30);
  return { k, n:nm, a:initials(nm).slice(0,3) || '?', c:CUSTOM_COLORS[Math.max(0,i)], fg:'#FFFFFF', g:'Autre' };
}
function opsFor(ag){
  const custom = (ag && ag.customOps) || {};
  let keys = (ag && Array.isArray(ag.ops) && ag.ops.length) ? ag.ops : DEFAULT_OPS;
  keys = keys.filter(k=>OP_CATALOG.some(o=>o.k===k) || (CUSTOM_KEYS.includes(k) && custom[k]));
  return (keys.length ? keys : DEFAULT_OPS).map(k=>opInfo(k, ag));
}
let OPS = opsFor(null);
// Opérateurs d'un point déjà enregistré : ceux du PDV + ceux présents dans le point (si la liste a changé depuis).
function opsOf(...pts){
  const L = [...OPS];
  pts.filter(Boolean).forEach(p=>Object.keys(p.soldes||{}).forEach(k=>{ if(!L.some(o=>o.k===k)) L.push(opInfo(k)); }));
  return L;
}
const ESP_COLOR = '#0E9F8E', CRED_COLOR = '#9DB3B0';
const DAY = 86400000;

/* ═════════ Outils ═════════ */
function localDate(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function fmtDateLong(s){ return cap(parseD(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})); }
function fmtDateShort(s){ return parseD(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
function fmtDay(d){ return d ? d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}) : '—'; }
function fmtTime(d){ return d ? d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : ''; }
function monthLabel(k){ const [y,m] = k.split('-').map(Number); return cap(new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})); }
function shiftMonth(k, n){ const [y,m] = k.split('-').map(Number); return monthKey(new Date(y, m-1+n, 1)); }
const NF = new Intl.NumberFormat('fr-FR');
function nfs(n){ return NF.format(Math.round(Number(n)||0)).replace(/[  ]/g,' '); }
function fmt(n){ return nfs(n)+' F'; }
function fmtS(n){ n = Math.round(Number(n)||0); return (n>0?'+':(n<0?'−':''))+nfs(Math.abs(n))+' F'; }
function num(v){ const d = String(v==null?'':v).replace(/[^\d]/g,''); return d ? parseInt(d,10) : 0; }
// Calcul dans un champ montant : « 5x100000 + 25000 », « 3*50 000 - 2 000 ». Renvoie null si ce n'est pas un calcul.
function hasCalc(raw){ return /\d\s*[+x×X*\-]\s*\d/.test(String(raw||'')); }
function evalAmount(raw){
  const t = String(raw||'').replace(/[xX×]/g,'*').replace(/[^\d+*\-]/g,'');
  if(!/^\d+([+*\-]\d+)*$/.test(t)) return null;
  let total = 0; for(const term of t.match(/[+\-]?[^+\-]+/g)){ const sign = term[0]==='-' ? -1 : 1; const prod = term.replace(/^[+\-]/,'').split('*').reduce((a,b)=>a*parseInt(b,10), 1); total += sign*prod; }
  return Math.max(0, Math.round(total));
}
function amountOf(raw){ if(hasCalc(raw)){ const r = evalAmount(raw); return r==null ? num(raw) : r; } return num(raw); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(s, r){ return (r||document).querySelector(s); }
function ptTime(p){ return tsDate(p && p.srvAt) || new Date(p && p.at); }
// Saisie faite après le jour du point (heure du serveur) : on le dit clairement au patron.
function isLate(p){ return !!(p && p.date && localDate(ptTime(p)) > p.date); }
function ptWhen(p){ const t = ptTime(p); return isLate(p) ? `le ${fmtDateShort(localDate(t))} à ${fmtTime(t)}` : `à ${fmtTime(t)}`; }
function lateTag(p){ return isLate(p) ? ' <span class="badge wait">Saisi en retard</span>' : ''; }
function tsDate(t){ if(!t) return null; if(t.toDate) return t.toDate(); if(t instanceof Date) return t; const d = new Date(t); return isNaN(d) ? null : d; }
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(_){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
function genCode(n){ const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; const r = new Uint32Array(n); crypto.getRandomValues(r); r.forEach(x=>s+=A[x%A.length]); return s; }
function agCode(id){ return 'AG-' + String(id||'').slice(0,6).toUpperCase(); }
function waDigits(s){ return String(s||'').replace(/[^\d]/g,''); }

let toastTimer;
function toast(msg, kind){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (kind ? ' '+kind : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.className = 'toast'; }, 3800);
}
async function copyText(t){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true; } }catch(_){}
  try{ const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; }catch(_){ return false; }
}

/* ═════════ État ═════════ */
let auth = null, db = null, FV = null, TS = null;
let USER = null, PROFILE = null, PROFILE_LOADED = false, AID = null, AGENCE = null, SETTINGS = {};
let POINTS = [], PAIEMENTS = [], TEAM = [], ALL_AG = [], ADMIN_FILTER = 'tous';
let IS_ADMIN = false, ADMIN_READY = false;
let VIEW = 'bord', GATE = 'login';
let MONTH_B = monthKey(new Date()), MONTH_H = monthKey(new Date());
const FORM = { type:'ouverture', date:localDate(), editing:false };
let SYNC = 'ok';
let LISTEN = { settings:null, profile:null, agence:null, points:null, paiements:null, team:null, all:null, sugs:null };
let DRAFT = {};
let CUR_ESP = null, CUR_CRED = null;   // détail du comptage des espèces et liste des crédits du formulaire en cours
function draftKey(){ return 'odis_draft_' + (USER ? USER.uid : 'x'); }

function stop(k){ if(LISTEN[k]){ try{ LISTEN[k](); }catch(_){} LISTEN[k] = null; } }
function stopAll(){ Object.keys(LISTEN).forEach(stop); }

/* ═════════ Réglages globaux (prix, lien Wave) ═════════ */
function prix(){ return Number(SETTINGS.prix) || Number(CFG.prix) || 2000; }
function prixSup(){ return Number(SETTINGS.prixSup) || Number(CFG.prixSup) || 1000; }
function priceOf(a){ return a && Number(a.tarif) > 0 ? prixSup() : prix(); }   // tarif > 0 = PDV rattaché : toujours le prix PDV supp. actuel
function myPrix(){ return priceOf(AGENCE); }
// Lien Wave au bon montant : on remplace le paramètre amount du lien de base.
function waveLinkFor(amount){ const l = waveLink(); if(!l) return ''; return /([?&])amount=\d+/.test(l) ? l.replace(/([?&])amount=\d+/, '$1amount='+amount) : l + (l.includes('?')?'&':'?') + 'amount=' + amount; }
function periode(){ return Number(SETTINGS.periode) || Number(CFG.periode) || 30; }
function waveLink(){ return SETTINGS.waveLink || CFG.waveLink || ''; }
function waAdmin(){ return waDigits(SETTINGS.waAdmin || ''); }

/* ═════════ Abonnement ═════════ */
function created0(a){ return tsDate(a && a.createdAt); }
function subStatus(a){
  if(!a) return { k:'bad', label:'Inconnu', usable:false, left:0, text:'' };
  const now = new Date(), exp = tsDate(a.exp), dec = tsDate(a.declared);
  const left = exp ? Math.ceil((exp - now)/DAY) : 0;
  const noTrial = !!(created0(a) && exp && exp <= created0(a));
  if(dec && (now - dec) < GRACE_DAYS*DAY && noTrial) return { k:'info', label:'Paiement déclaré', usable:false, left,
    text:`Paiement déclaré le ${fmtDay(dec)}. L'agence sera activée dès que l'administrateur aura vérifié le paiement.` };
  if(dec && (now - dec) < GRACE_DAYS*DAY){
    const until = new Date(dec.getTime() + GRACE_DAYS*DAY);
    return { k:'info', label:'Paiement déclaré', usable:true, left, until,
      text:`Paiement déclaré le ${fmtDay(dec)}. L'app reste utilisable jusqu'au ${fmtDay(until)}, le temps que l'administrateur vérifie le paiement.` };
  }
  const created = tsDate(a.createdAt), trial = !!(created && exp && (exp - created) > 0 && (exp - created) <= ((Number(CFG.essai)||7) + 1)*DAY);
  if(exp && exp > now && trial) return { k:'warn', label:'Essai gratuit', trial:true, usable:true, left,
    text:`Essai gratuit jusqu'au ${fmtDay(exp)}. Payez l'abonnement avant cette date pour continuer sans interruption.` };
  if(exp && exp > now){
    if(left <= REMIND_DAYS) return { k:'warn', label:'À renouveler', usable:true, left,
      text:`L'abonnement se termine le ${fmtDay(exp)}. Renouvelez maintenant : les jours restants ne sont pas perdus.` };
    return { k:'ok', label:'Actif', usable:true, left, text:`Abonnement valide jusqu'au ${fmtDay(exp)}.` };
  }
  return { k:'bad', label:'Suspendu', usable:false, left,
    text: dec ? `Le paiement déclaré le ${fmtDay(dec)} n'a pas encore été validé et le délai de grâce est passé. La saisie est suspendue, les données sont conservées.`
              : (created && exp && exp <= created) ? `Ce numéro de téléphone a déjà bénéficié de l'essai gratuit. Payez l'abonnement pour activer l'agence, puis touchez « J'ai payé ».`
              : trial ? `L'essai gratuit s'est terminé le ${fmtDay(exp)}. La saisie est suspendue, les données sont conservées. Payez l'abonnement pour continuer.`
              : `L'abonnement a expiré le ${fmtDay(exp)}. La saisie est suspendue, les données sont conservées. Payez pour réactiver.` };
}
function canWrite(){ return subStatus(AGENCE).usable; }

/* ═════════ Calculs des points ═════════ */
function calc(p){
  const s = p.soldes || {};
  const flt = Object.values(s).reduce((a,v)=>a+(Number(v)||0), 0);
  const esp = Number(p.espece)||0, cr = Number(p.credits)||0;
  const total = flt + esp + cr;
  const budget = Number(p.budget)||0;
  return { flt, esp, cr, total, budget, ecart: total - budget };
}
function tone(e){ return e<0 ? 'neg' : (e>0 ? 'pos' : 'zero'); }
function toneLabel(e){ return e<0 ? 'Manquant' : (e>0 ? 'Surplus' : 'Équilibré'); }
function toneSentence(e){ return e<0 ? 'Manquant par rapport au budget voté' : (e>0 ? 'Surplus par rapport au budget voté' : 'Le compte tombe juste sur le budget voté'); }
function getPoint(date, type){ return POINTS.find(p=>p.date===date && p.type===type) || null; }
function sortedPoints(){ return [...POINTS].sort((a,b)=> a.date===b.date ? (a.type==='ouverture'?-1:1) : (a.date<b.date?-1:1)); }
function lastPoint(){ const s = sortedPoints(); return s.length ? s[s.length-1] : null; }
function prevPoint(date, type){
  let res = null;
  sortedPoints().forEach(p=>{ if(p.date<date || (p.date===date && type==='fermeture' && p.type==='ouverture')) res = p; });
  return res;
}
function isPendingProfile(){ return !!(PROFILE && PROFILE.role==='gerante' && PROFILE.status==='attente'); }
let WAS_PENDING = false;
function isPatron(){ return PROFILE && PROFILE.role==='patron'; }
function yesterday(){ const d = new Date(); d.setDate(d.getDate()-1); return localDate(d); }
function canEdit(p){ return canWrite() && (isPatron() || p.date >= yesterday()); }
function budgetNow(){ return Number(AGENCE && AGENCE.budget) || 0; }
function pointVals(p){ const v = {}; OPS.forEach(o=>v[o.k]=Number(p.soldes[o.k])||0); v.espece = p.espece; v.credits = p.credits; v.note = p.note||''; v._esp = p.espDetail||null; v._cred = p.credList||null; return v; }

/* ═════════ Règle d'écart ═════════ */
function rulerSpan(e, b){ return Math.max(Math.abs(e)*1.6, (b||0)*0.05, 10000); }
function rulerHTML(e, b, light, id){
  const span = rulerSpan(e, b);
  return `<div class="ruler${light?' light':''}"${id?` id="${id}"`:''} data-e="${e}" data-b="${b}" role="img" aria-label="${toneLabel(e)} de ${fmt(Math.abs(e))}">
    <div class="ruler-track"><div class="ruler-fill ${tone(e)}"></div><div class="ruler-zero"></div></div>
    <div class="ruler-scale"><span>−${nfs(span)}</span><span>Budget</span><span>+${nfs(span)}</span></div></div>`;
}
function setRuler(el, e, b){
  if(!el) return;
  const span = rulerSpan(e, b), pct = Math.min(Math.abs(e)/span, 1) * 50;
  const f = el.querySelector('.ruler-fill'); f.className = 'ruler-fill ' + tone(e);
  const w = e===0 ? 1.2 : pct;
  f.style.left = (e<0 ? 50-w : (e===0 ? 50-w/2 : 50)) + '%'; f.style.width = w + '%';
  const sc = el.querySelectorAll('.ruler-scale span'); sc[0].textContent = '−'+nfs(span); sc[2].textContent = '+'+nfs(span);
}
function animateRulers(root){
  (root||document).querySelectorAll('.ruler[data-e]').forEach(el=>{
    requestAnimationFrame(()=>requestAnimationFrame(()=>setRuler(el, Number(el.dataset.e), Number(el.dataset.b))));
  });
}

/* ═════════ Écrans d'accueil ═════════ */
function showGate(html){
  $('#app').classList.add('hidden'); $('#gate').classList.remove('hidden');
  $('#gate-body').innerHTML = `<div class="g-brand">Odi's <span>Agence</span></div><p class="g-sub">Système de traçabilité, ouverture et fermeture</p>` + html + gateAccounts();
  enhancePasswords($('#gate-body'));
}
function gateAccounts(){
  if(USER) return '';
  const others = accounts().filter(a=>a.app!==CUR_APP);
  if(!others.length && !PREV_APP) return '';
  return `<div class="g-accts"><p>${PREV_APP ? 'Ajout d\'un compte' : 'Autres comptes sur ce téléphone'}</p>

function authMsg(e){ const m = authMsgBase(e), c = (e && e.code) || ''; try{ console.error("Odi's Agence :", e); }catch(_){} return c && !m.includes('code :') ? m + ' (code : ' + c + ')' : m; }
function authMsgBase(e){
  const c = (e && e.code) || '';
  if(c.includes('email-already-in-use')) return 'Cette adresse e-mail a déjà un compte. Connectez-vous à la place.';
  if(c.includes('invalid-email')) return "L'adresse e-mail n'est pas valide.";
  if(c.includes('weak-password')) return 'Mot de passe trop court : 8 caractères minimum.';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return 'Adresse e-mail ou mot de passe incorrect.';
  if(c.includes('too-many-requests')) return 'Trop de tentatives. Patientez quelques minutes puis réessayez.';
  if(c.includes('network-request-failed') || c.includes('unavailable')) return "Pas de connexion internet. Vérifiez le réseau puis réessayez.";
  if(c.includes('permission-denied')) return "Opération refusée par le serveur. Vérifiez le code ou réessayez.";
  if(c.includes('missing-email')) return "Indiquez votre adresse e-mail.";
  if(c.includes('operation-not-allowed')) return "La connexion par e-mail n'est pas activée dans Firebase : Authentication, Mode de connexion, Adresse e-mail/Mot de passe.";
  if(c.includes('configuration-not-found')) return "Authentication n'est pas encore démarré dans Firebase : ouvrez Authentication et cliquez sur Commencer.";
  if(c.includes('unauthorized-domain')) return "Cette adresse n'est pas autorisée dans Firebase : Authentication, Paramètres, Domaines autorisés.";
  if(c.includes('api-key') || c.includes('invalid-api-key')) return "La clé de config.js ne correspond pas au projet Firebase.";
  if(c==='not-found' || /does not exist/i.test((e&&e.message)||'')) return "La base Firestore n'existe pas encore : créez-la dans Firestore Database (mode production).";
  console.error('Odi\'s Agence :', e);
  return "Une erreur est survenue (code : " + (c || ((e && e.message) || 'inconnu').slice(0,80)) + "). Envoyez ce code à l'administrateur.";
}

function normParrain(c){ c = String(c||'').toUpperCase().replace(/\s+/g,''); if(/^[A-Z0-9]{6}$/.test(c)) c = 'AG-' + c; return /^AG-[A-Z0-9]{6}$/.test(c) ? c : ''; }

function trialKey(tel){ const d = waDigits(tel); return d.length > 10 ? d.slice(-10) : d; }
let NO_TRIAL = false;
async function createAgency(uid, d){
  const ref = db.collection('agences').doc(), key = trialKey(d.tel);
  try{ NO_TRIAL = false; await writeAgency(uid, d, ref, key, false); }
  catch(e){ if(!String(e && e.code).includes('permission-denied')) throw e; NO_TRIAL = true; await writeAgency(uid, d, db.collection('agences').doc(), key, true); }
}
async function writeAgency(uid, d, ref, key, used){
  const exp = used ? new Date(Date.now() - DAY) : new Date(Date.now() + (Number(CFG.essai)||7)*DAY);
  const batch = db.batch();
  if(!used) batch.set(db.doc('trials/'+key), { aid:ref.id, at:FV.serverTimestamp() });
  batch.set(ref, { nom:d.agence, ville:d.ville, telephone:d.tel, ownerUid:uid, ownerNom:d.nom,
    exp:TS.fromDate(exp), declared:null, createdAt:FV.serverTimestamp(), budget:0, waPatron:waDigits(d.tel).slice(0,15), invite:'', trialKey:key, ...(d.parrain ? { parrainCode:d.parrain } : {}) });
  batch.set(db.doc('users/'+uid), { agenceId:ref.id, role:'patron', nom:d.nom, email:(USER&&USER.email)||auth.currentUser.email||'', createdAt:FV.serverTimestamp() });
  await batch.commit();
}

  if(trialKey(d.tel).length < 8){ gateErr('Numéro WhatsApp invalide : indiquez le numéro complet.'); return; }

async function findInvite(code){

}

let PENDING_SETUP = false, BOOTED_UID = null;
function configured(){
  const f = CFG.firebase || {};
  return !!(f.apiKey && f.projectId && !/COLLER/i.test(f.apiKey + f.projectId));
}
function boot(){
  if(!window.firebase){
    showGate(`<h2 class="g-title">Connexion nécessaire</h2><p class="muted" style="margin-top:6px">Le premier lancement a besoin d'internet pour charger l'application. Vérifiez la connexion puis rechargez la page.</p><div class="g-links"><button class="btn primary" onclick="location.reload()">Recharger</button></div>`);
    return;
  }
  if(!configured()){
    showGate(`<h2 class="g-title">Configuration à faire</h2><p class="muted" style="margin-top:6px">Le fichier <b>config.js</b> ne contient pas encore la configuration de votre projet Firebase. Suivez l'étape 2 du guide de mise en ligne, puis republiez le dossier.</p>`);
    return;
  }
  FV = firebase.firestore.FieldValue; TS = firebase.firestore.Timestamp;
  let start = lsGet('odis_active_app', '[DEFAULT]');
  if(start !== '[DEFAULT]' && !accounts().some(a=>a.app===start)) start = '[DEFAULT]';
  useApp(start);
}

/* ═════════ Plusieurs comptes sur le même téléphone (comme Gmail) ═════════
   Chaque compte a sa propre instance Firebase, donc sa propre session : on bascule sans ressaisir le mot de passe. */
let CUR_APP = '[DEFAULT]', AUTH_UNSUB = null, PREV_APP = null;
const PERSIST_DONE = {};
function accounts(){ return lsGet('odis_accounts', []); }
function saveAccounts(L){ lsSet('odis_accounts', L); }
function upsertAccount(info){
  const L = accounts().filter(a=>a.app!==info.app && a.uid!==info.uid); L.push(info); saveAccounts(L);
}
function getApp(name){
  const found = firebase.apps.find(a=>a.name===name);
  if(found) return found;
  return name==='[DEFAULT]' ? firebase.initializeApp(CFG.firebase) : firebase.initializeApp(CFG.firebase, name);
}
function useApp(name){
  stopAll(); if(AUTH_UNSUB){ try{ AUTH_UNSUB(); }catch(_){} AUTH_UNSUB = null; }
  USER = null; PROFILE = null; PROFILE_LOADED = false; AGENCE = null; AID = null; BOOTED_UID = null; POINTS = []; PAIEMENTS = []; TEAM = []; ALL_AG = [];
  IS_ADMIN = false; ADMIN_READY = false; VIEW = 'bord'; closeMenu();
  const app = getApp(name);
  CUR_APP = name; lsSet('odis_active_app', name);
  auth = app.auth(); db = app.firestore();
  if(!PERSIST_DONE[name]){ PERSIST_DONE[name] = true; try{ db.enablePersistence({ synchronizeTabs:true }).catch(()=>{}); }catch(_){} }
  showGate(`<div style="margin-top:24px"><div class="spin" style="border-color:var(--line);border-top-color:var(--lagoon)"></div></div>`);
  AUTH_UNSUB = auth.onAuthStateChanged(u=>{
    if(CUR_APP !== name) return;
    if(!u){
      stopAll(); USER = null; PROFILE = null; AGENCE = null; AID = null; BOOTED_UID = null; POINTS = [];
      saveAccounts(accounts().filter(a=>a.app!==name));
      GATE = 'login'; renderGate(); return;
    }
    if(PENDING_SETUP) return;   // l'inscription termine elle-même la mise en place
    upsertAccount({ app:name, uid:u.uid, email:u.email||'', nom:u.displayName||'', agence:'', role:'' });
    bootUser(u);
  });
}
function switchAccount(name){ if(name===CUR_APP){ closeMenu(); return; } PREV_APP = null; useApp(name); }
function addAccount(){ PREV_APP = CUR_APP; useApp('acc-' + Date.now().toString(36)); }
function cancelAdd(){ const back = PREV_APP; PREV_APP = null; const cur = CUR_APP;

/* Boîte à suggestions : le message part sur le WhatsApp de l'administrateur */
let SUG_TYPE = 'Idée';
function openSuggest(){
  closeMenu(); SUG_TYPE = 'Idée';
  const o = $('#modal'); o.classList.remove('hidden');
  o.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="sug-t">
    <div class="modal-top"><h2 id="sug-t">Faire une suggestion</h2><button class="modal-x" data-action="close-modal" aria-label="Fermer">×</button></div>
    <p class="card-text">Une idée, un problème, une question ? Votre message arrive directement sur le WhatsApp de l'équipe Odi's Agence.</p>
    <div class="sug-types" role="group" aria-label="Type de message">${['Idée','Problème','Question'].map(t=>`<button data-action="sug-type" data-t="${t}" aria-pressed="${t===SUG_TYPE}">${t==='Idée'?'💡':(t==='Problème'?'⚠️':'❓')} ${t}</button>`).join('')}</div>
    <div class="field" style="margin-top:14px"><label for="sug-msg">Votre message</label><textarea class="txt" id="sug-msg" rows="5" placeholder="Exemple : ce serait bien de pouvoir…"></textarea></div>
    <p class="g-err" id="sug-err"></p>
    <button class="btn wa block" data-action="sug-send">Envoyer sur WhatsApp</button></div>`;
  setTimeout(()=>{ const t = $('#sug-msg'); if(t) t.focus(); }, 50);
}
function closeModal(){ const o = $('#modal'); o.classList.add('hidden'); o.innerHTML = ''; }
function sendSuggest(){
  const msg = ($('#sug-msg').value||'').trim();
  if(msg.length < 5){ $('#sug-err').textContent = 'Écrivez votre message avant d\'envoyer.'; return; }
  const num = waAdmin() || waDigits(CFG.waAdmin || '');
  const who = PROFILE ? `${PROFILE.nom||''} (${PROFILE.role==='gerante'?'gérante':'patron'})` : (USER ? USER.email : '');
  const txt = `${SUG_TYPE==='Idée'?'💡':(SUG_TYPE==='Problème'?'⚠️':'❓')} ${SUG_TYPE} — Odi's Agence\n`
    + (AGENCE ? `Agence : ${AGENCE.nom} (${agCode(AGENCE.id)})${AGENCE.ville?', '+AGENCE.ville:''}\n` : '')
    + `De : ${who}\n\n${msg}`;
  const url = num ? `https://wa.me/${num}?text=${encodeURIComponent(txt)}` : `https://wa.me/?text=${encodeURIComponent(txt)}`;
  window.open(url, '_blank', 'noopener');
  db.collection('suggestions').add({ type:SUG_TYPE, msg:msg.slice(0,1000), aid:String(AID||'').slice(0,40), agence:String(AGENCE?AGENCE.nom:'').slice(0,100), nom:String((PROFILE&&PROFILE.nom)||'').slice(0,100), role:(PROFILE&&['patron','gerante'].includes(PROFILE.role))?PROFILE.role:'', by:USER.uid, at:FV.serverTimestamp(), status:'nouveau' }).catch(()=>{});
  closeModal(); toast('Merci ! WhatsApp s\'ouvre avec votre message : touchez Envoyer.');
}

/* Œil pour afficher ou masquer le mot de passe */
const EYE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.5 0-10-7-10-7a18.8 18.8 0 0 1 5.1-5.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>';
function enhancePasswords(root){
  (root||document).querySelectorAll('input[type=password]:not([data-eye])').forEach(inp=>{
    inp.setAttribute('data-eye','1');
    const w = document.createElement('span'); w.className = 'pw-wrap';
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pw-eye'; b.setAttribute('aria-label','Afficher le mot de passe'); b.innerHTML = EYE;
    b.addEventListener('click', ()=>{ const show = inp.type==='password'; inp.type = show ? 'text' : 'password';
      b.innerHTML = show ? EYE_OFF : EYE; b.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe'); inp.focus(); });
    w.appendChild(b);
  });
}
function bootUser(u){
  if(BOOTED_UID === u.uid && LISTEN.profile) return;
  stopAll(); BOOTED_UID = u.uid; VIEW = 'bord'; TEAM = []; WAS_PENDING = false;
  USER = u; PROFILE = null; PROFILE_LOADED = false; AGENCE = null; AID = null; POINTS = [];
  const adminEmail = String(CFG.adminEmail||'').trim().toLowerCase();
  IS_ADMIN = !!adminEmail && String(u.email||'').toLowerCase() === adminEmail;
  ADMIN_READY = IS_ADMIN && !!u.emailVerified;
  DRAFT = lsGet(draftKey(), {});
  showGate(`<div style="margin-top:24px"><div class="spin" style="border-color:var(--line);border-top-color:var(--lagoon)"></div><p class="muted" style="text-align:center;margin-top:12px">Chargement de votre agence…</p></div>`);
  LISTEN.settings = db.doc('settings/app').onSnapshot(s=>{ SETTINGS = s.exists ? (s.data()||{}) : {}; scheduleRender(); }, ()=>{});
  LISTEN.profile = db.doc('users/'+u.uid).onSnapshot(s=>{
    PROFILE_LOADED = true;
    PROFILE = s.exists ? s.data() : null;
    const aid = PROFILE ? PROFILE.agenceId : null;
    const pend = isPendingProfile();
    if(aid !== AID || (WAS_PENDING && !pend)){ stop('agence'); stop('points'); stop('paiements'); stop('team'); AID = aid; AGENCE = null; POINTS = []; if(aid && !pend) listenAgency(aid); }
    WAS_PENDING = pend;
    if(!PROFILE && ADMIN_READY) listenAll();
    route();
  }, e=>{ PROFILE_LOADED = true; route(); });
  if(ADMIN_READY) listenAll();
}
function listenAgency(aid){
  LISTEN.agence = db.doc('agences/'+aid).onSnapshot(s=>{
    AGENCE = s.exists ? { id:s.id, ...s.data({ serverTimestamps:'estimate' }) } : null;
    OPS = opsFor(AGENCE);
    if(!AGENCE && PROFILE){ route(); return; }
    route();
  }, ()=>{ route(); });
  LISTEN.points = db.collection('agences/'+aid+'/points').onSnapshot({ includeMetadataChanges:true }, snap=>{
    POINTS = snap.docs.map(d=>d.data()).filter(p=>p && p.date && p.type && p.soldes);
    SYNC = snap.metadata.hasPendingWrites ? 'pending' : (snap.metadata.fromCache ? 'cache' : 'ok');
    updateSync(); scheduleRender();
  }, e=>{ SYNC = 'cache'; updateSync(); });
  LISTEN.paiements = db.collection('agences/'+aid+'/paiements').onSnapshot(snap=>{
    PAIEMENTS = snap.docs.map(d=>({ id:d.id, ...d.data({ serverTimestamps:'estimate' }) })).sort((a,b)=>(tsDate(b.validatedAt)||0)-(tsDate(a.validatedAt)||0));
    scheduleRender();
  }, ()=>{});
}
function listenTeam(){
  if(LISTEN.team || !AID || !isPatron()) return;
  LISTEN.team = db.collection('users').where('agenceId','==',AID).onSnapshot(snap=>{
    TEAM = snap.docs.map(d=>({ uid:d.id, ...d.data() })); scheduleRender();
  }, ()=>{});
}
function listenAll(){
  if(LISTEN.all) return;
  LISTEN.all = db.collection('agences').onSnapshot(snap=>{
    ALL_AG = snap.docs.map(d=>({ id:d.id, ...d.data({ serverTimestamps:'estimate' }) }));
    scheduleRender();
  }, ()=>{});
}
function route(){
  if(!USER || !PROFILE_LOADED) return;
  if(!PROFILE && !IS_ADMIN){ GATE = 'orphan'; renderGate(); return; }
  if(isPendingProfile()){ GATE = 'pending'; renderGate(); return; }
  if(PROFILE && !AGENCE && !IS_ADMIN) return;   // en attente de l'agence
  $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
  if(USER){ const role = PROFILE ? PROFILE.role : (IS_ADMIN ? 'admin' : ''); const ag = AGENCE ? AGENCE.nom : '';
    const cur = accounts().find(a=>a.app===CUR_APP);
    if(!cur || cur.agence!==ag || cur.role!==role || cur.aid!==(AID||'') || cur.nom!==(PROFILE&&PROFILE.nom||cur.nom)) upsertAccount({ app:CUR_APP, uid:USER.uid, email:USER.email||'', nom:(PROFILE&&PROFILE.nom)||USER.displayName||'', agence:ag, role, aid:AID||'' });
    const av = $('#acct-btn'); if(av){ av.textContent = initials(ag || (PROFILE&&PROFILE.nom) || USER.email); av.title = (ag?ag+' · ':'') + (USER.email||''); }
    const n = accounts().length; const bd = $('#acct-n'); if(bd){ bd.textContent = n; bd.classList.toggle('hidden', n<2); } }
  if(PROFILE && isPatron()) listenTeam();
  if(ADMIN_READY) listenAll();
  if(!AGENCE && !['console','monagence'].includes(VIEW)) VIEW = IS_ADMIN ? 'console' : 'bord';
  if(AGENCE && VIEW==='monagence') VIEW = 'bord';
  render();
  showNews();
}
function logout(){
  closeMenu();
  if(SYNC==='pending' && !confirm("Des saisies attendent encore d'être envoyées. Si vous vous déconnectez maintenant, elles seront perdues. Se déconnecter quand même ?")) return;
  const others = accounts().filter(a=>a.app!==CUR_APP), cur = CUR_APP, curAuth = auth;
  saveAccounts(others);
  if(others.length){
    const next = others[others.length-1].app;
    curAuth.signOut().catch(()=>{}).finally(()=>{ try{ const a = firebase.apps.find(x=>x.name===cur); if(a && cur!=='[DEFAULT]') a.delete(); }catch(_){} });
    useApp(next);
  } else if(curAuth) curAuth.signOut();
}

/* ═════════ Synchronisation ═════════ */
function updateSync(){
  const el = $('#sync'); if(!el) return;
  let cls, txt;
  if(!navigator.onLine){ cls = 'off'; txt = 'Hors ligne'; }
  else if(SYNC==='pending'){ cls = 'wait'; txt = 'Envoi en cours'; }
  else if(SYNC==='cache'){ cls = 'wait'; txt = 'Connexion…'; }
  else { cls = 'ok'; txt = 'Synchronisé'; }
  if(!navigator.onLine && SYNC==='pending') txt = 'Hors ligne, envoi en attente';
  el.className = 'sync ' + cls; el.querySelector('span').textContent = txt;
}
window.addEventListener('online', updateSync); window.addEventListener('offline', updateSync);
let RENDER_T = null, PENDING_RENDER = false;
function inputFocused(){ const a = document.activeElement, m = $('#main'); return !!(a && m && m.contains(a) && a.matches('input,textarea,select')); }
function scheduleRender(){
  clearTimeout(RENDER_T);
  RENDER_T = setTimeout(()=>{
    if(!USER || $('#app').classList.contains('hidden')) return;
    if($('#point-form') || inputFocused()){ PENDING_RENDER = true; renderNav(); updateSync(); if($('#point-form')) updateLive(); return; }
    PENDING_RENDER = false; render();
  }, 120);
}
document.addEventListener('focusout', ()=>{
  if(!PENDING_RENDER) return;
  setTimeout(()=>{ if(PENDING_RENDER && !inputFocused() && !$('#point-form')){ PENDING_RENDER = false; render(); } }, 300);
});
function writeErr(e, what){
  const c = (e && e.code) || '';
  if(c.includes('permission-denied')) toast(`${what} a été refusé par le serveur : abonnement, date (aujourd'hui ou hier seulement) ou point modifié sur un autre téléphone. Votre saisie est gardée : rechargez l'app puis réessayez.`, 'err');
  else toast(`${what} n'a pas pu être envoyé. Il sera réessayé au retour du réseau.`, 'err');
}

/* ═════════ Navigation ═════════ */
function tabList(){
  const t = [];
  if(AGENCE){
    t.push(['bord','Tableau de bord'],['ouverture','Ouverture'],['fermeture','Fermeture'],['historique','Historique'],['abonnement','Abonnement']);
    if(isPatron()) t.push(['reglages','Réglages']);
  } else if(IS_ADMIN) t.push(['monagence','Mon agence']);
  if(IS_ADMIN) t.push(['console','Console']);
  t.push(['aide','Aide']);
  return t;
}
function renderNav(){
  const today = localDate();
  $('#top-date').textContent = fmtDateLong(today);
  $('#top-name').textContent = AGENCE ? AGENCE.nom : "Odi's Agence";
  $('#top-role').textContent = PROFILE ? (PROFILE.role==='patron' ? 'Patron(ne)' : 'Gérant(e)') : 'Administrateur';
  const st = subStatus(AGENCE);
  $('#tabs').innerHTML = tabList().map(([k,l])=>{
    let dot = '';
    if(AGENCE && (k==='ouverture' || k==='fermeture')){ const done = !!getPoint(today, k); dot = `<span class="tdot ${done?'ok':'wait'}" title="${done?"Fait aujourd'hui":"À faire aujourd'hui"}"></span>`; }
    if(AGENCE && k==='abonnement' && st.k!=='ok') dot = `<span class="tdot ${st.k==='bad'?'bad':'wait'}"></span>`;
    if(k==='console'){ const n = ALL_AG.filter(a=>tsDate(a.declared)).length; if(n) dot = `<span class="tdot wait" title="${n} paiement(s) à vérifier"></span>`; }
    return `<button class="tab" data-view="${k}"${VIEW===k?' aria-current="page"':''}>${l}${dot}</button>`;
  }).join('');
}
function go(v){
  if(v==='ouverture' || v==='fermeture'){ if(FORM.type!==v) FORM.editing = false; FORM.type = v; }
  VIEW = v; render(); window.scrollTo({ top:0 });
}
function render(){
  if(!USER) return;
  renderNav(); updateSync();
  const m = $('#main');
  const valid = tabList().map(t=>t[0]);
  if(!valid.includes(VIEW)) VIEW = valid[0] || 'bord';
  if(VIEW==='bord') renderBord(m);
  else if(VIEW==='ouverture' || VIEW==='fermeture'){ FORM.type = VIEW; renderForm(m); }
  else if(VIEW==='historique') renderHist(m);
  else if(VIEW==='abonnement') renderAbonnement(m);
  else if(VIEW==='reglages'){ renderReglages(m); inviteValidity(); }
  else if(VIEW==='console') renderConsole(m);
  else if(VIEW==='aide') renderAide(m);
  else if(VIEW==='monagence') m.innerHTML = `<header class="view-head"><h1>Mon agence</h1><p>Votre compte administrateur n'est relié à aucune agence. Créez-en une pour suivre vos propres points.</p></header><section class="panel" style="max-width:520px">${orphanForms()}</section>`;
}
function teamNotice(){
  if(!isPatron()) return '';
  const n = TEAM.filter(u=>u.role==='gerante' && u.status==='attente').length;
  return n ? `<div class="notice info"><span><b>${n} demande${n>1?'s':''}</b> pour rejoindre l'agence : vérifiez que c'est bien votre gérant(e).</span><button class="btn" data-view="reglages">Voir</button></div>` : '';
}
function missedNotice(){
  const y = yesterday(), o = getPoint(y,'ouverture'), f = getPoint(y,'fermeture');
  if(!o || f) return '';
  if(isPatron()){
    const msg = `Bonjour, la fermeture d'hier (${fmtDateLong(y).toLowerCase()}) n'a pas été faite dans Odi's Agence. Merci de la faire maintenant : onglet Fermeture, date d'hier.`;
    return `<div class="notice"><span>La <b>fermeture d'hier</b> n'a pas été faite.</span><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Relancer sur WhatsApp</a></div>`;
  }
  return `<div class="notice"><span>Vous n'avez pas fait la <b>fermeture d'hier</b>. Vous pouvez encore la faire aujourd'hui.</span><button class="btn" data-action="do-missed">Faire la fermeture d'hier</button></div>`;
}
function pendingNotice(){
  if(SYNC!=='pending') return '';
  return `<div class="notice info"><span><b>Envoi en attente.</b> Vos saisies sont gardées sur ce téléphone et partiront dès le retour du réseau. Ne videz pas les données du navigateur et ne désinstallez pas l'app d'ici là.</span></div>`;
}
window.addEventListener('beforeunload', e=>{ if(SYNC==='pending'){ e.preventDefault(); e.returnValue = ''; } });
function subNotice(){
  const s = subStatus(AGENCE);
  if(s.k==='ok') return '';
  const cls = s.k==='bad' ? 'bad' : (s.k==='info' ? 'info' : '');
  return `<div class="notice ${cls}"><span>${s.k==='bad' ? 'Abonnement suspendu : la saisie est bloquée.' : (s.k==='info' ? 'Paiement déclaré, en attente de validation.' : `${s.trial ? 'Essai gratuit' : 'Abonnement'} : plus que ${s.left} jour${s.left>1?'s':''}.`)}</span><button class="btn" data-view="abonnement">${s.trial ? 'Payer' : (s.k==='bad'||s.k==='warn' ? 'Renouveler' : 'Voir')}</button></div>`;
